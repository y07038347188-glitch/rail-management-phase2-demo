/* === JRPG retro town skin: visual-only; accounting engine unchanged === */
:root{--ink:#263b36;--muted:#536861;--line:#a9cbbb;--bg:#e7f1db;--green:#177c54;--green-dark:#126747}
body{background:repeating-linear-gradient(90deg,#eaf3df 0 14px,#e6f0db 14px 28px)}
.scene{position:relative;height:350px;border:4px solid #3e6957;border-radius:10px;overflow:hidden;box-shadow:0 5px 0 #acc5a5;background:#92bd76}
.scene canvas{display:block;width:100%;height:100%;object-fit:cover;image-rendering:pixelated;image-rendering:crisp-edges;cursor:crosshair;touch-action:manipulation}

.btn:hover{background:#166748}.ghost{border-radius:5px;border:2px solid #739980}

function investCard(cat){const selected=s.planned[cat.key],rem=capacity()-totalPlanned();return `<div class="invest-row"><div class="invest-text"><div class="invest-label">${cat.icon} ${cat.label}</div></div><div class="stepper"><button aria-label="${cat.label}を1億円減らす" data-action="invest" data-cat="${cat.key}" data-delta="-1" ${selected<=0?'disabled':''}>−</button><b aria-label="${selected}億円">${selected}</b><button aria-label="${cat.label}を1億円増やす" data-action="invest" data-cat="${cat.key}" data-delta="1" ${selected>=4||rem<1?'disabled':''}>＋</button></div></div>`}
function budget(){
 const reserve=2,spendable=Math.max(0,s.cash-reserve),limit=capacity(),t=totalPlanned();
 const income=s.last?.kind==='settle'?(s.last.income||0):0,expense=s.last?.kind==='settle'?(s.last.expense||0):0,repayment=s.last?.kind==='settle'?(s.last.repayment||0):0;
 const availableAfter=s.cash+s.borrowChoice-t,ideal=6;
 const caution=availableAfter<ideal;
 return `<div class="budget-compact"><div class="budget-step-guide">① 年初は「使う予定」を決めるだけ。現金はこの時点では減りません。<br>② 支払いは各四半期に分けて実行。経営イベントの費用は別途発生します。</div><div class="budget-title"><span class="eyebrow">${s.year}年目｜投資計画</span><strong>投資可能 <em>${limit}億円</em></strong></div>
 <div class="cash-explanation" aria-label="投資可能額の計算の内訳">
  <div>① 現金の計算 <b>${s.openingCash} ＋ 回収${income} − 支払${expense} − 返済${repayment} ＝ ${s.cash}億</b></div>
  <div>② 投資枠 <b>現金${s.cash} − 最低確保${reserve} ＋ 借入${s.borrowChoice} ＝ ${limit}億</b></div>
 </div>
 <div class="budget-borrow"><span>🏦 銀行借入（上限${s.borrowCap}億）</span><div class="stepper"><button aria-label="借入を1億円減らす" data-action="borrow" data-value="${s.borrowChoice-1}" ${s.borrowChoice===0||t>spendable+s.borrowChoice-1?'disabled':''}>−</button><b>${s.borrowChoice}</b><button aria-label="借入を1億円増やす" data-action="borrow" data-value="${s.borrowChoice+1}" ${s.borrowChoice>=s.borrowCap?'disabled':''}>＋</button></div></div>
 <div class="budget-list">${CATS.map(investCard).join('')}</div>
 <div class="budget-totals"><span>年初に約束する投資 ${t}億</span><strong>残り ${Math.max(0,limit-t)}億</strong></div>
 <div class="cash-advice ${caution?'cash-advice-warn':''}" aria-label="現金を残す目安"><span>💡 目安：<b>${ideal}億円以上</b>残す（次の四半期の人件費2億＋運営費4億）</span><strong>投資全額支払後 ${availableAfter}億</strong></div>
 ${spendable===0?'<p class="budget-lock">🔒 現金だけでは投資できません。借入を検討できます。</p>':''}
 <div class="actions"><button class="btn" data-action="commit">この予算を決めて1年を始める ▶</button></div></div>`
}
function eventScreen(){
 if(s.year===3&&s.q===1)return `<div class="event-compact"><div class="eyebrow">3年目・Q1｜🚨 重大イベント</div><h1 class="h1">情報セキュリティ事故</h1><p class="event-context">年初に決めた投資も今期分を自動で支払い、情報漏えいの損失は過去の教育投資で軽減します。</p><div class="accident-metrics"><span>基本損失 <b>5億円</b></span><span>教育による軽減 <b>−${Math.min(3,s.active.training)}億円</b></span><span>実際の損失 <b>${5-Math.min(3,s.active.training)}億円</b></span></div><div class="actions"><button class="btn" data-action="incident">事故の結果を確認 ▶</button></div></div>`;
 const key=`${s.year}-${s.q}`,e=EVENTS[key],meta=EVENT_META[key]||['経営判断','駅長'];
 const selected=selectedChoice>=0?chosenPreview(e,selectedChoice):null;
 const yearBudget=totalPlanned(),doneBudget=Object.values(s.spent).reduce((a,b)=>a+b,0),nowDue=planQuarterCost(s.q).length;
 const crisisNote=e.major?(e.kind==='typhoon'?`【事前準備】現在安全${s.safety}/10。安全8以上なら、台風の被害額が1億円になります。`:e.kind==='staff'?`【事前準備】現在社員${s.employees}人。80人以上なら臨時の応援費を回避します。`:'【確定の危機】感染症で売上が3億円減る見込みです。'):' ';
 return `<div class="event-compact event-v08"><div class="eyebrow">${s.year}年目 Q${s.q} ｜ ${esc(meta[0])}｜${esc(meta[1])}からの相談</div>
 <h1 class="h1">${esc(e.title)}</h1>
 <p class="event-context">${esc(e.description)}</p><div class="annual-bridge" aria-label="年初予算と今回の経営判断の関係">📋 年初の投資予算 ${yearBudget}億円（支払済${doneBudget}億円） → 今期の自動支払 ${nowDue}億円<br>今回の3択の追加費用は、この予算とは別です。</div>${e.major?`<p class="crisis-banner">⚠️ ${esc(crisisNote)}<br>危機の影響は選択に関係なく発生します。</p>`:``}
 <div class="choice-list" role="group" aria-label="経営方針を選ぶ">${e.options.map((o,i)=>`<button class="choice ${selectedChoice===i?'choice-selected':''}" aria-pressed="${selectedChoice===i}" data-action="pick" data-idx="${i}" ${o.borrowExtra&&s.borrowed+o.borrowExtra>s.borrowCap?`disabled title="借入上限に達しています"`:``}><span class="choice-key">${'ABC'[i]}</span><span class="choice-copy"><strong>${esc(o.label)}</strong><small>追加費用 ${o.cost}億円${o.borrowExtra?`・借入＋${o.borrowExtra}億円`:``}　｜　${esc(o.main)}</small></span><span class="arr">${selectedChoice===i?'✓':'›'}</span></button>`).join('')}</div>
 ${selected?`<div class="decision-forecast" aria-live="polite"><div><b>今回の判断で何が変わる？</b><span>年初予算とは別に＋${selected.o.cost}億円</span></div><strong>${esc(selected.seen)}</strong><p>${esc(selected.note)}</p><small>🏙 街の変化：${esc(selected.scene)}</small></div>
 <div class="actions"><button class="btn" data-action="confirmChoice">この方針で実行する ▶</button></div>`:`<div class="decision-wait">☝ A・B・Cを選ぶと、利益・安全・街への影響を確認できます。</div>`}</div>`;
}
function resultScreen(){
 const d=s.last,pdelta=d.afterProfit-d.preProfit,cdelta=d.afterCash-d.preCash;
 const key=`${d.year}-${d.quarter}`;const selectedIdx=EVENTS[key]?.options.findIndex(o=>o.label===d.chosen?.label)??-1;
 const direct=d.accident?`教育投資で事故損失を${5-d.accident}億円軽減`:d.chosen?.main||'経営判断を実行';
 const visual=EVENT_VISUALS[key]?.[selectedIdx]||d.chosen?.label||'駅の様子が変化';
 return `<div class="result-v08"><div class="eyebrow">${d.year}年目 Q${d.quarter}｜経営判断の結果</div>
 <h1 class="h1">🏙 ${esc(visual)}</h1>
 <p class="result-learning">判断の効果：<b>${esc(direct)}</b>${d.accident?'':` ｜ 追加費用 ${d.chosen.cost||0}億円`}</p>${d.shock?`<p class="crisis-result">⚠️ ${esc(d.shock.title)}：${esc(d.shock.detail)}<br>この影響は対応方針とは別に発生しました。</p>`:``}
 <div class="delta"><div class="box"><div class="boxtitle">現金残高</div><div class="big" id="cashAnimated" data-from="${d.preCash}" data-to="${d.afterCash}">${fmt(d.afterCash)}</div><div class="desc">この四半期 ${signed(cdelta)}</div></div><div class="box"><div class="boxtitle">今年の累計純利益</div><div class="big ${d.afterProfit<0?'negative':'positive'}">${fmt(d.afterProfit)}</div><div class="desc">この四半期 ${signed(pdelta)}</div></div></div>
 <div class="cash-flow-story"><b>💴 今期の現金の内訳</b><div class="cash-money-eq">開始 ${d.preCash}億円 <span>→</span> 終了 ${d.afterCash}億円</div>
 <div class="money-lines">${d.movements.filter(m=>m.value!==0||m.label==='年初に決めた投資の支払').map(m=>`<div><span>${esc(m.label)}</span><strong class="${m.value<0?'negative':'positive'}">${signed(m.value)}</strong></div>`).join('')}</div>
 <div class="cash-invest-summary">📋 年初の予算：${d.yearBudget}億円 ｜ 支払済：${d.paidSoFar}億円 ｜ 今後の支払予定：${d.yearBudget-d.paidSoFar}億円</div>
 <p>※今期の売上はP/Lに計上しますが、現金の入金は翌期です。経営イベントの追加費用と、年初に決めた投資の支払いは別です。</p></div>
 <div class="actions"><button class="btn" data-action="nextQuarter">${d.quarter===4?'年度末の財務三表へ':'次の四半期へ'} ▶</button></div></div>`;
}
function row(name,val,emph=false){return `<tr class="${emph?'emph':''}"><td>${esc(name)}</td><td>${val}</td></tr>`}
let financeTab='pl', selectedChoice=-1; // A tentative choice never changes the accounts
function annualScreen(){const d=s.snapshot,p=d.pl,cf=d.cf;const assets=bs().assets,liab=bs().liab;
 const plrows=[row('売上',fmt(p.revenue)),row('人件費',fmt(-p.personnel)),row('営業費用・追加費',fmt(-p.operations-p.discretionary-p.incident)),row('諸税・減価償却',fmt(-p.levies-p.depreciation)),row('営業利益',fmt(d.operatingProfit),true),row('利息・法人税',fmt(-p.interest-p.tax)),row('当期純利益',fmt(d.profit),true)];
 const bsrows=[row('現金',fmt(s.cash)),row('売掛金・その他資産',fmt(s.ar+s.otherAssets)),row('固定資産',fmt(s.fixed)),row('資産合計',fmt(assets),true),row('負債',fmt(s.longDebt+s.shortDebt+s.otherLiab+s.ap)),row('純資産',fmt(s.equity)),row('負債＋純資産',fmt(liab),true)];
 const cfrows=[row('営業CF',fmt(cf.operating)),row('投資CF',fmt(cf.investing)),row('財務CF',fmt(cf.financing)),row('現金の増減',fmt(cf.operating+cf.investing+cf.financing),true),row('期首現金',fmt(d.openingCash)),row('期末現金',fmt(s.cash),true)];
 const datas={pl:{title:'P/L：今年はいくら儲かった？',rows:plrows},bs:{title:'B/S：現金・資産・負債は？',rows:bsrows},cf:{title:'C/F：現金はどう動いた？',rows:cfrows}};
 const active=datas[financeTab]||datas.pl;
 return `<div class="eyebrow">${s.year}年目｜年度末決算</div><div class="finance-top"><h1 class="h1">3つの財務諸表</h1><span>利益 ${signed(d.profit)} ／ 現金 ${fmt(s.cash)}</span></div><div class="finance-tabs" role="group" aria-label="見る財務諸表">${[['pl','P/L'],['bs','B/S'],['cf','C/F']].map(([v,label])=>`<button data-action="tab" data-tab="${v}" class="${financeTab===v?'selected':''}" aria-pressed="${financeTab===v}">${label}</button>`).join('')}</div><div class="sheet finance-one"><h3>${active.title}</h3><table>${active.rows.join('')}</table></div><div class="finance-sentence">${financeTab==='pl'?'利益は現金と同じではありません。':financeTab==='bs'?'設備投資は現金を減らし、固定資産を増やします。':'営業・投資・財務の現金の流れを確認しましょう。'} ${assets===liab?'':'※貸借不一致（要検証）'}</div><div class="actions"><button class="btn" data-action="nextYear">${s.year===3?'最終結果へ':'翌年度の投資へ'} ▶</button></div>`
}
function finalScreen(){const score=futureScore(),total=s.history.reduce((a,h)=>a+h.profit,0),review=total>4&&score.score>=6?'財務と将来への投資を両立できました。':total<0?'利益を生む仕組みの見直しが必要です。':score.cash<score.need?'経営を続けましたが、現金と返済に注意が必要です。':'利益・現金・安全の関係を振り返りましょう。';return `<div class="eyebrow">経営シミュレーション完了</div><h1 class="h1">3年間の経営結果</h1><div class="final-grid"><div class="box"><div class="desc">累計純利益</div><strong>${fmt(total)}</strong></div><div class="box"><div class="desc">翌年期首の現金</div><strong>${fmt(score.cash)}</strong></div><div class="box"><div class="desc">短期借入残高</div><strong>${fmt(s.shortDebt)}</strong></div><div class="box"><div class="desc">将来性</div><strong>${score.score} / 10点</strong></div></div><p class="finance-sentence">${review} 現金を確保するのは、次の投資を選べるようにするためです。</p><div class="actions"><button class="btn" data-action="restart">もう一度経営する ▶</button></div>`}
function bankruptScreen(){return `<div class="eyebrow">経営シミュレーション終了</div><h1 class="h1 negative">現金不足で経営終了</h1><p class="lead">${esc(s.reason)}</p><div class="delta"><div class="box"><div class="boxtitle">現金</div><div class="big negative">${fmt(s.cash)}</div></div><div class="box"><div class="boxtitle">純利益</div><div class="big">${fmt(netProfit())}</div></div></div><p class="finance-sentence">利益が黒字でも、支払いに使える現金がなければ投資や事業継続はできません。</p><div class="actions"><button class="btn" data-action="restart">再挑戦する ▶</button></div>`}
function render(){let content='';try{invariants();}catch(e){console.error(e);content=`<p>会計データの整合性エラーです。試作版のデータを初期化してください。</p><button class="btn" data-action="restart">やり直す</button>`}
 if(!content)content=({intro,budget,event:eventScreen,result:resultScreen,annual:annualScreen,final:finalScreen,bankrupt:bankruptScreen})[s.phase]?.()||intro();
 root.innerHTML=`<header class="header"><div class="brand"><div class="brand-logo">🚆</div><div><strong>未来つくり鉄道</strong><small>駅と街の経営ゲーム｜ v1.0</small></div></div><div class="header-right"><span class="chip">3年間・12四半期</span><button class="ghost" data-action="help">ルール</button><button class="ghost" data-action="restart">最初から</button></div></header>${trainScene()}${kpis()}${track()}<section id="gameContent" class="mainpanel vis-transition" tabindex="-1">${content}</section><div class="footer">金額はすべて億円の整数／試作版の財務数値・イベントは教育用モデルです／自動保存 ／ 借入の翌年度返済を修正 ／ 1画面 v1.0</div>`;
 bind();startRpgWorld();if(s.phase==='result')animateCash()}
function animateCash(){const el=document.getElementById('cashAnimated');if(!el||window.matchMedia?.('(prefers-reduced-motion: reduce)').matches)return;const from=Number(el.dataset.from),to=Number(el.dataset.to);const start=performance.now();const duration=500;function frame(t){if(!el.isConnected)return;const d=Math.min(1,(t-start)/duration);el.textContent=fmt(Math.round(from+(to-from)*(1-Math.pow(1-d,3))));if(d<1)requestAnimationFrame(frame)}requestAnimationFrame(frame)}
function help(){alert('【未来つくり鉄道】\n・3年間（12四半期）を経営します。\n・各年初に5項目へ1億円ずつ投資配分します。\n・現金から最低2億円を確保して投資枠を計算します。余裕を持つなら、次の四半期の基本支出5億円程度を残すのが一つの目安です。\n・銀行借入を選べますが、翌年度初めに元本を全額返済します。\n・四半期イベントの3択で経営を判断します。\n・3年目Q1は情報漏えい事故の自動結果確認です。\n・各年度末にP/L・B/S・C/Fの3表を見ます。\n・金額はすべて整数の億円、結果は自動保存されます。')}
function bind(){root.querySelectorAll('[data-action]').forEach(el=>{el.addEventListener('click',()=>{const action=el.dataset.action;try{if(action==='start'){beginYear();focusTop();return}if(action==='restart'){resetGame();return}if(action==='help'){help();return}if(action==='tab'){financeTab=el.dataset.tab;render();return}if(action==='borrow'){setBorrow(Number(el.dataset.value));return}if(action==='invest'){budgetChange(el.dataset.cat,Number(el.dataset.delta));return}if(action==='commit'){commitBudget();focusTop();return}if(action==='pick'){selectedChoice=Number(el.dataset.idx);render();return}if(action==='confirmChoice'){if(selectedChoice<0)return;const index=selectedChoice;selectedChoice=-1;runQuarter(index);focusTop();return}if(action==='choice'){runQuarter(Number(el.dataset.idx));focusTop();return}if(action==='incident'){runQuarter(-1);focusTop();return}if(action==='nextQuarter'){nextFromResult();focusTop();return}if(action==='nextYear'){nextFromAnnual();focusTop();return}}catch(e){console.error(e);alert('計算エラーが発生しました。コンソールとゲームの状態を確認してください。')}})})}
// Public test-only hooks: invoked by developer tools without affecting the participant UI.
window.__MIRAI_TEST__={getState:()=>clone(s),reset:()=>{s=initial();store();render()},start:()=>beginYear(),borrow:setBorrow,allocate:budgetChange,commit:commitBudget,turn:runQuarter,next:nextFromResult,advance:nextFromAnnual,assert:invariants,allEvents:EVENTS};
render();
})();
</script>
