<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>未来つくり鉄道 経営シミュレーション Phase 2</title><style>:root {
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: var(--game-white);
  background: var(--game-sky);
  line-height: 1.65;
  --game-sky: #68b9ee;
  --game-screen: #07111e;
  --game-border: #05090f;
  --game-white: #f8fbff;
  --game-blue: #2f9df4;
  --game-green: #38ce7a;
  --game-gold: #ffd45a;
  --game-red: #ff5b57;
  --game-muted: #abc0d1;
  --game-panel: #10253a;
  --game-panel-strong: #0c1c2d;
  --game-ink: #07111e;
  --game-orange: #ff923f;
  --game-violet: #a992ff;
  --game-focus: #fff27a;
}

* {
  box-sizing: border-box;
}

html {
  min-width: 320px;
  background: var(--game-sky);
}

body {
  min-height: 100vh;
  margin: 0;
  overflow-x: hidden;
  color: var(--game-white);
  background:
    radial-gradient(ellipse 80px 28px at 12% 10%, #ffffffd9 0 58%, transparent 60%),
    radial-gradient(ellipse 105px 34px at 76% 15%, #ffffffc7 0 58%, transparent 60%),
    linear-gradient(166deg, transparent 0 72%, #4e94a3 72.2% 78%, transparent 78.2%),
    linear-gradient(194deg, transparent 0 74%, #357984 74.2% 82%, transparent 82.2%),
    linear-gradient(180deg, #72c8f7 0, var(--game-sky) 62%, #b8e2f3 100%);
  isolation: isolate;
}

body::before,
body::after {
  position: fixed;
  right: 0;
  left: 0;
  z-index: -1;
  pointer-events: none;
  content: "";
}

body::before {
  bottom: 34px;
  height: 84px;
  opacity: .5;
  background:
    linear-gradient(90deg, transparent 0 3%, #214b5b 3% 8%, transparent 8% 11%, #214b5b 11% 16%, transparent 16% 23%, #214b5b 23% 31%, transparent 31% 37%, #214b5b 37% 42%, transparent 42% 55%, #214b5b 55% 64%, transparent 64% 70%, #214b5b 70% 78%, transparent 78% 86%, #214b5b 86% 94%, transparent 94%),
    repeating-linear-gradient(90deg, transparent 0 24px, #d9f4ff 25px 30px, transparent 31px 48px);
  background-size: 100% 100%, 100% 24px;
  background-position: 0 0, 0 24px;
  background-repeat: no-repeat;
  animation: cloud-drift 80s linear infinite;
}

body::after {
  bottom: 0;
  height: 38px;
  border-top: 6px solid var(--game-border);
  border-bottom: 6px solid var(--game-border);
  background:
    repeating-linear-gradient(90deg, transparent 0 20px, #5a422c 20px 28px, transparent 28px 48px),
    #c99c65;
}

button,
input,
textarea {
  font: inherit;
}

button {
  min-height: 48px;
  max-width: 100%;
  padding: .72rem 1.2rem;
  border: 3px solid var(--game-white);
  border-radius: 2px;
  background: var(--game-blue);
  box-shadow: 4px 4px 0 var(--game-border);
  color: var(--game-white);
  font-weight: 900;
  letter-spacing: .04em;
  cursor: pointer;
  transition: transform 140ms ease, box-shadow 140ms ease, filter 140ms ease;
}

button:hover:not(:disabled) {
  filter: brightness(1.1);
  transform: translate(-1px, -1px);
  box-shadow: 6px 6px 0 var(--game-border);
}

button:active:not(:disabled) {
  transform: translate(3px, 3px);
  box-shadow: 1px 1px 0 var(--game-border);
}

button.secondary {
  border-color: var(--game-white);
  background: #dcecf5;
  color: var(--game-ink);
}

button:disabled {
  opacity: .48;
  filter: grayscale(.35);
  cursor: not-allowed;
}

button:focus-visible,
input:focus-visible,
textarea:focus-visible,
summary:focus-visible,
.option:focus-within {
  outline: 4px solid var(--game-focus);
  outline-offset: 4px;
}

h1,
h2,
h3,
h4,
p,
ul {
  overflow-wrap: anywhere;
}

h1,
h2,
h3 {
  line-height: 1.3;
}

h1,
.screen-kicker,
.turn-title,
.stage-label,
.option-letter,
.rank-badge {
  font-weight: 950;
  letter-spacing: .08em;
}

.shell {
  width: 100%;
  max-width: 1120px;
  margin: auto;
  padding: clamp(.85rem, 2vw, 1.4rem);
}

.header {
  position: relative;
  z-index: 5;
  border-bottom: 4px solid var(--game-white);
  background: var(--game-screen);
  box-shadow: 0 4px 0 var(--game-border);
  color: var(--game-white);
}

.header .hud-inner {
  display: grid;
  grid-template-columns: minmax(190px, 1fr) auto auto;
  align-items: center;
  gap: 1rem;
}

.hud-brand,
.hud-brand > div,
.status-heading,
.option-top,
.emergency-heading {
  display: flex;
  align-items: center;
}

.hud-brand {
  min-width: 0;
  gap: .8rem;
}

.hud-brand strong,
.hud-brand span {
  display: block;
}

.hud-brand span {
  color: var(--game-muted);
  font-size: .7rem;
  letter-spacing: .14em;
}

.progress {
  margin: 0;
  font-size: .92rem;
}

.hud-progress {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: .4rem;
}

.hud-progress span {
  padding: .3rem .55rem;
  border: 2px solid #48657e;
  background: #12283e;
  font-weight: 800;
  white-space: nowrap;
}

.hud-home {
  justify-self: end;
}

.game-frame,
.hero {
  position: relative;
  width: min(100%, 1060px);
  margin: 1.25rem auto;
  border: 6px solid var(--game-white);
  border-radius: 2px;
  outline: 4px solid var(--game-border);
  background: var(--game-screen);
  box-shadow: 10px 10px 0 #07273d59;
  color: var(--game-white);
}

.game-frame {
  clip-path: polygon(12px 0, calc(100% - 12px) 0, calc(100% - 12px) 4px, 100% 4px, 100% calc(100% - 12px), calc(100% - 4px) calc(100% - 12px), calc(100% - 4px) 100%, 12px 100%, 12px calc(100% - 4px), 0 calc(100% - 4px), 0 12px, 4px 12px, 4px 4px, 12px 4px);
}

.pixel-border {
  max-width: 100%;
}

.management-screen .decision-panel {
  border-color: var(--game-blue);
}

.game-frame::before,
.game-frame::after {
  position: absolute;
  z-index: 1;
  width: 9px;
  height: 9px;
  background: var(--game-gold);
  box-shadow: 0 0 0 2px var(--game-border);
  content: "";
}

.game-frame::before {
  top: 12px;
  left: 12px;
}

.game-frame::after {
  right: 12px;
  bottom: 12px;
}

.game-screen {
  position: relative;
  min-width: 0;
  padding: clamp(1rem, 3vw, 2.25rem);
  background:
    linear-gradient(#ffffff06 1px, transparent 1px),
    linear-gradient(90deg, #ffffff06 1px, transparent 1px),
    var(--game-screen);
  background-size: 24px 24px;
}

.hero {
  min-height: min(680px, calc(100vh - 5rem));
  padding: clamp(2rem, 7vw, 5.3rem) clamp(1rem, 5vw, 3.5rem);
  overflow: hidden;
  text-align: center;
}

.hero::before {
  display: block;
  width: 92px;
  height: 46px;
  margin: 0 auto 1.2rem;
  border: 4px solid var(--game-white);
  border-radius: 12px 12px 3px 3px;
  background:
    linear-gradient(90deg, transparent 0 10%, #c9efff 10% 36%, transparent 36% 42%, #c9efff 42% 68%, transparent 68% 74%, #c9efff 74% 90%, transparent 90%),
    linear-gradient(180deg, var(--game-blue) 0 58%, var(--game-white) 58% 70%, var(--game-green) 70% 100%);
  box-shadow:
    -24px 38px 0 -19px var(--game-gold),
    24px 38px 0 -19px var(--game-gold),
    -24px 38px 0 -15px var(--game-border),
    24px 38px 0 -15px var(--game-border);
  content: "";
}

.hero::after {
  position: absolute;
  right: -8%;
  bottom: 0;
  left: -8%;
  height: 70px;
  border-top: 5px solid var(--game-white);
  background:
    repeating-linear-gradient(90deg, transparent 0 20px, #6f4e2d 20px 29px, transparent 29px 50px),
    linear-gradient(180deg, #316b43 0 38%, #8f6840 38%);
  content: "";
}

.hero h1 {
  margin: .25rem 0;
  color: var(--game-white);
  font-size: clamp(2.35rem, 7vw, 4.8rem);
  letter-spacing: .08em;
  text-shadow: 4px 4px 0 #000, -2px -2px 0 #174b70;
}

.hero h2 {
  margin: .2rem 0 0;
  color: var(--game-gold);
  font-size: clamp(1.05rem, 3vw, 1.65rem);
  letter-spacing: .13em;
}

.hero > p:not(.eyebrow):not(.error) {
  display: inline-block;
  margin: 1.2rem auto;
  padding: .3rem .8rem;
  border: 2px solid #62809a;
  background: #0d2134;
  color: var(--game-white);
  font-weight: 850;
}

.hero .eyebrow {
  color: var(--game-muted);
}

.hero .actions {
  position: relative;
  z-index: 2;
  justify-content: center;
  max-width: 620px;
  margin: 1.4rem auto 3.8rem;
}

.hero [data-action="new"] {
  min-width: min(100%, 260px);
  border-color: var(--game-gold);
  background: var(--game-green);
  color: var(--game-ink);
  animation: start-pulse 2.2s ease-in-out infinite;
}

.hero [data-action="new"]::before {
  display: block;
  color: var(--game-ink);
  font-size: .72rem;
  letter-spacing: .18em;
  content: "GAME START";
}

.screen-heading {
  margin: 0 auto 1.5rem;
  text-align: center;
}

.screen-heading h1 {
  margin: .15rem 0;
  color: var(--game-white);
  font-size: clamp(1.85rem, 5vw, 3.35rem);
  text-shadow: 4px 4px 0 #000;
}

.screen-kicker {
  margin: 0;
  color: var(--game-gold);
  font-size: clamp(.82rem, 2vw, 1.05rem);
  letter-spacing: .2em;
}

.turn-title {
  max-width: 880px;
  margin: -.5rem auto 1.5rem;
  color: var(--game-white);
  font-size: clamp(1.15rem, 3.6vw, 2rem);
  text-align: center;
}

.panel,
details {
  min-width: 0;
  margin: 1rem 0;
  padding: clamp(1rem, 2.5vw, 1.55rem);
  border: 2px solid #53708a;
  border-radius: 2px;
  background: var(--game-panel);
  box-shadow: 4px 4px 0 var(--game-border);
  color: var(--game-white);
}

.panel > :first-child,
details > :first-child {
  margin-top: 0;
}

.panel > :last-child,
details > :last-child {
  margin-bottom: 0;
}

details {
  background: #0c1e31;
}

details[open] {
  border-color: var(--game-blue);
}

summary {
  min-height: 44px;
  color: var(--game-white);
  font-weight: 850;
  cursor: pointer;
}

summary::marker {
  color: var(--game-gold);
}

.actions {
  display: flex;
  flex-wrap: wrap;
  gap: .75rem;
  margin-top: 1.25rem;
}

.confirm-actions {
  justify-content: center;
}

.confirm-actions button {
  min-width: min(100%, 310px);
  background: var(--game-green);
  color: var(--game-ink);
}

.grid {
  display: grid;
  min-width: 0;
  gap: 1rem;
}

.metrics {
  grid-template-columns: repeat(3, minmax(0, 1fr));
}

.metric,
.financial-metrics > div {
  min-width: 0;
  padding: 1rem;
  border: 2px solid #53708a;
  border-radius: 2px;
  background: var(--game-panel-strong);
  box-shadow: 3px 3px 0 var(--game-border);
}

.metric strong,
.financial-metrics strong {
  display: block;
  margin-top: .25rem;
  color: var(--game-white);
  font-size: clamp(1.2rem, 2.4vw, 1.55rem);
}

.metric small {
  display: block;
}

.status-heading {
  gap: .55rem;
  color: var(--game-muted);
  font-weight: 850;
}

.status-card.required {
  border-color: var(--game-gold);
}

.secondary-metrics .metric {
  background: #142c43;
}

.secondary-metrics.has-security {
  grid-template-columns: repeat(2, minmax(0, 1fr));
}

.views,
.resources,
.options {
  grid-template-columns: repeat(3, minmax(0, 1fr));
}

.view,
.resource {
  min-width: 0;
  padding: 1rem;
  border: 2px solid #53708a;
  border-radius: 2px;
  background: #0d1d2d;
}

.option {
  position: relative;
  display: flex;
  min-width: 0;
  min-height: 100%;
  padding: 1rem;
  border: 3px solid var(--game-white);
  border-radius: 2px;
  background: #0b1b2c;
  box-shadow: 5px 5px 0 var(--game-border);
  color: var(--game-white);
  cursor: pointer;
  flex-direction: column;
  transition: border-color 150ms ease, background 150ms ease, box-shadow 150ms ease, transform 150ms ease;
}

.option:hover {
  border-color: #9fdcff;
  background: #112c45;
}

.option.selected {
  border-color: var(--game-gold);
  background: #19364b;
  box-shadow: 5px 7px 0 #000, 0 0 0 2px #5a4614 inset;
  transform: translateY(-5px);
}

.option input {
  position: absolute;
  width: 1px;
  height: 1px;
  opacity: .01;
  clip-path: inset(50%);
}

.option-top {
  justify-content: space-between;
  gap: .75rem;
}

.option-letter {
  display: grid;
  width: 2.65rem;
  height: 2.65rem;
  border: 3px solid var(--game-white);
  background: var(--game-blue);
  box-shadow: 3px 3px 0 var(--game-border);
  color: var(--game-white);
  font-size: 1.55rem;
  place-items: center;
}

.option h3 {
  margin: 1rem 0 .4rem;
  color: var(--game-white);
  font-size: 1.2rem;
}

.option h4 {
  margin: .9rem 0 0;
  color: var(--game-gold);
}

.option p {
  margin: .3rem 0;
}

.option-summary {
  color: #dceaf5;
}

.selection-state {
  display: block;
  margin-top: auto;
  padding-top: 1rem;
  border-top: 2px dashed #53708a;
  color: var(--game-muted);
  font-weight: 900;
  text-align: center;
}

.option.selected .selection-state {
  color: var(--game-gold);
}

.rule-cards {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: .8rem;
  margin: 1.25rem 0;
}

.rule-card {
  min-width: 0;
  padding: 1rem;
  border: 3px solid var(--game-white);
  background: #102a42;
  box-shadow: 4px 4px 0 var(--game-border);
}

.rule-card span,
.rule-card strong {
  display: block;
}

.rule-card span {
  margin-bottom: .55rem;
  color: var(--game-gold);
  font-size: 1.35rem;
  font-weight: 950;
  letter-spacing: .1em;
}

.mission-copy {
  margin: .75rem auto 1.5rem;
  color: var(--game-white);
  font-size: clamp(1.05rem, 2.6vw, 1.45rem);
  font-weight: 850;
  text-align: center;
}

.mission-start {
  border-color: var(--game-green);
}

.tutorial-notice {
  padding: .75rem 1rem;
  border: 2px solid var(--game-blue);
  background: #0b3152;
  color: var(--game-white);
  text-align: center;
}

.year-start-banner {
  display: grid;
  width: min(100%, 760px);
  margin: 1.15rem auto 1.5rem;
  padding: .8rem 1rem;
  border: 4px solid var(--game-white);
  outline: 4px solid var(--game-border);
  background: var(--game-blue);
  box-shadow: 7px 7px 0 #123a574d;
  color: var(--game-white);
  text-align: center;
  place-items: center;
}

.year-start-banner span {
  color: var(--game-gold);
  letter-spacing: .18em;
}

.year-start-banner strong {
  font-size: clamp(1.8rem, 5vw, 3rem);
  letter-spacing: .14em;
  text-shadow: 3px 3px 0 #000;
}

.year-start-banner p {
  margin: 0;
  font-weight: 850;
}

.year-start-banner.year-2 {
  background: #286c60;
}

.year-start-banner.year-3 {
  background: #6a3f71;
}

.major-event-screen {
  border-color: #fff2e8;
  box-shadow: 10px 10px 0 #61211f78;
}

.major-event-screen .screen-kicker,
.event-result-screen .screen-kicker {
  color: var(--game-orange);
}

.emergency-news {
  border: 3px solid var(--game-red);
  background: #3a171b;
  box-shadow: 5px 5px 0 #160709;
}

.emergency-heading {
  gap: .7rem;
}

.warning-lamp {
  width: 18px;
  height: 18px;
  border: 3px solid var(--game-white);
  border-radius: 50%;
  background: var(--game-red);
  box-shadow: 0 0 0 3px #6c1717, 0 0 14px var(--game-red);
  animation: warning-pulse 1.6s ease-in-out infinite;
  flex: 0 0 auto;
}

.result-panel,
.stage-score-panel,
.final-summary {
  animation: result-reveal 380ms ease-out both;
}

.result-title,
.final-result {
  margin: .6rem auto 1.3rem;
  color: var(--game-gold);
  font-size: clamp(1.75rem, 6vw, 3.8rem);
  font-weight: 950;
  line-height: 1.25;
  text-align: center;
  text-shadow: 3px 3px 0 #000;
}

.result-message {
  max-width: 820px;
  margin: 1rem auto 1.5rem;
  padding: 1.15rem;
  border: 3px solid var(--game-white);
  background: #07111e;
  color: var(--game-white);
  font-size: clamp(1.05rem, 2.7vw, 1.35rem);
  font-weight: 800;
  text-align: center;
}

.result-metric {
  position: relative;
  padding-top: 3.2rem;
}

.result-badge {
  position: absolute;
  top: .7rem;
  left: .7rem;
  padding: .2rem .45rem;
  border: 2px solid currentColor;
  background: #05090f;
  font-size: .72rem;
  font-weight: 950;
  letter-spacing: .07em;
}

.result-metric.up {
  border-color: var(--game-green);
}

.result-metric.up .result-badge {
  color: var(--game-green);
}

.result-metric.keep {
  border-color: var(--game-blue);
}

.result-metric.keep .result-badge {
  color: #83cbff;
}

.result-metric.down {
  border-color: var(--game-red);
}

.result-metric.down .result-badge {
  color: #ff918e;
}

.event-result-name {
  color: var(--game-orange);
  font-weight: 900;
  text-align: center;
}

.stage-clear-screen,
.ending-screen {
  border-color: var(--game-gold);
  box-shadow: 10px 10px 0 #6c521e66, 0 0 38px #ffd45a24;
}

.final-screen .final-summary {
  border-color: var(--game-gold);
}

.stage-label {
  width: fit-content;
  margin: -1rem auto 1rem;
  padding: .35rem .8rem;
  border: 2px solid var(--game-gold);
  color: var(--game-gold);
  text-align: center;
}

.stage-decoration,
.ending-decoration {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: .8rem;
  color: var(--game-gold);
  font-size: 1.2rem;
}

.score {
  color: var(--game-gold);
  font-size: clamp(2.2rem, 7vw, 4.7rem);
  font-weight: 950;
  line-height: 1.1;
  text-align: center;
  text-shadow: 4px 4px 0 #000;
  animation: score-pop 420ms 100ms ease-out both;
}

.score-gauge {
  display: block;
  width: min(100%, 560px);
  height: 24px;
  margin: 1rem auto 1.8rem;
  accent-color: var(--game-gold);
}

.rank-badge {
  display: grid;
  width: 92px;
  height: 92px;
  margin: .6rem auto;
  border: 5px solid var(--game-gold);
  background: #091625;
  box-shadow: 5px 5px 0 var(--game-border);
  color: var(--game-gold);
  font-size: 3rem;
  place-items: center;
  animation: score-pop 420ms 180ms ease-out both;
}

.rank-label {
  text-align: center;
}

.management-tags {
  display: flex;
  flex-wrap: wrap;
  gap: .4rem;
}

.history,
.management-log {
  display: grid;
  gap: .7rem;
}

.management-log,
.reflection {
  border: 5px solid var(--game-white);
  outline: 3px solid var(--game-border);
  background: var(--game-screen);
}

.history article {
  padding: .8rem 1rem;
  border-left: 5px solid var(--game-blue);
  background: #11283d;
}

.reflection label {
  display: block;
  margin: 1rem 0;
  color: var(--game-white);
  font-weight: 800;
}

.reflection textarea {
  display: block;
  width: 100%;
  min-height: 100px;
  margin-top: .4rem;
  padding: .75rem;
  border: 3px solid #7891a6;
  border-radius: 0;
  background: #f6fbff;
  color: var(--game-ink);
}

.tag {
  display: inline-block;
  padding: .3rem .65rem;
  border: 2px solid var(--game-gold);
  border-radius: 2px;
  background: #253044;
  color: var(--game-white);
  font-weight: 800;
}

.status {
  font-weight: 900;
}

.danger {
  color: #ff918e;
}

.caution {
  color: var(--game-gold);
}

.standard {
  color: var(--game-blue);
}

.comfortable {
  color: #66eaa1;
}

.error {
  border: 3px solid var(--game-red);
  background: #3a171b;
}

.eyebrow {
  color: var(--game-blue);
  font-weight: 900;
  letter-spacing: .09em;
}

.muted {
  color: var(--game-muted);
}

.presentation {
  max-width: 830px;
}

.presentation-card {
  text-align: center;
}

.presentation-card ul {
  display: inline-block;
  text-align: left;
}

.only-print {
  display: none;
}

.pixel-icon {
  position: relative;
  display: inline-block;
  width: 27px;
  height: 27px;
  flex: 0 0 27px;
}

.pixel-icon-shield {
  background: var(--game-blue);
  box-shadow: inset 0 0 0 3px var(--game-white), 3px 3px 0 var(--game-border);
  clip-path: polygon(12% 8%, 88% 8%, 88% 56%, 50% 96%, 12% 56%);
}

.pixel-icon-coin {
  border: 3px solid #fff0a8;
  border-radius: 50%;
  background: var(--game-gold);
  box-shadow: inset 0 0 0 3px #a57210, 3px 3px 0 var(--game-border);
}

.pixel-icon-coin::after {
  position: absolute;
  inset: 6px 9px;
  background: #a57210;
  content: "";
}

.pixel-icon-chart {
  border-bottom: 4px solid var(--game-white);
  border-left: 4px solid var(--game-white);
  background:
    linear-gradient(135deg, transparent 0 48%, var(--game-green) 49% 61%, transparent 62%),
    linear-gradient(90deg, transparent 0 10%, var(--game-blue) 10% 24%, transparent 24% 36%, var(--game-blue) 36% 51%, transparent 51% 63%, var(--game-green) 63% 80%, transparent 80%);
}

.pixel-icon-rail {
  border-top: 5px solid var(--game-white);
  border-bottom: 5px solid var(--game-white);
  background: repeating-linear-gradient(90deg, transparent 0 5px, var(--game-gold) 5px 8px);
}

.pixel-icon-signal {
  width: 14px;
  margin-right: 6px;
  border: 3px solid var(--game-white);
  background: linear-gradient(var(--game-red) 0 33%, var(--game-gold) 33% 66%, var(--game-green) 66%);
  box-shadow: 7px 17px 0 -5px var(--game-white);
}

.pixel-icon-station {
  border: 3px solid var(--game-white);
  background: linear-gradient(135deg, transparent 0 20%, var(--game-blue) 21% 50%, transparent 51%) top / 100% 45% no-repeat, linear-gradient(90deg, var(--game-gold) 0 25%, transparent 25% 40%, var(--game-gold) 40% 65%, transparent 65%) bottom / 100% 58% no-repeat;
}

.pixel-icon-train {
  border: 3px solid var(--game-white);
  border-radius: 7px 7px 2px 2px;
  background: linear-gradient(90deg, #bde9ff 0 36%, var(--game-blue) 36% 48%, #bde9ff 48% 84%, var(--game-blue) 84%);
  box-shadow: inset 0 -7px 0 var(--game-green), 3px 3px 0 var(--game-border);
}

.pixel-icon-trophy {
  width: 25px;
  height: 22px;
  border: 4px solid var(--game-gold);
  border-top: 0;
  background: #9b7016;
  box-shadow: 0 7px 0 -3px var(--game-gold), 0 11px 0 -2px #9b7016;
}

@keyframes start-pulse {
  0%,
  100% {
    filter: brightness(1);
  }

  50% {
    filter: brightness(1.2);
    box-shadow: 6px 6px 0 var(--game-border), 0 0 16px #38ce7a66;
  }
}

@keyframes warning-pulse {
  0%,
  100% {
    opacity: .55;
  }

  50% {
    opacity: 1;
    box-shadow: 0 0 0 3px #6c1717, 0 0 22px var(--game-red);
  }
}

@keyframes result-reveal {
  from {
    opacity: 0;
    transform: translateY(10px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes score-pop {
  from {
    opacity: 0;
    transform: scale(.88);
  }

  to {
    opacity: 1;
    transform: scale(1);
  }
}

@keyframes cloud-drift {
  from {
    background-position: 0 0, 0 24px;
  }

  to {
    background-position: 0 0, 160px 24px;
  }
}

@media (max-width: 800px) {
  .header .hud-inner {
    grid-template-columns: 1fr auto;
  }

  .hud-progress {
    grid-column: 1 / -1;
    grid-row: 2;
    justify-content: flex-start;
  }

  .metrics,
  .views,
  .resources,
  .options {
    grid-template-columns: 1fr 1fr;
  }

  .rule-cards {
    grid-template-columns: 1fr 1fr;
  }

  .hero {
    min-height: auto;
  }
}

@media (max-width: 520px) {
  body::before {
    opacity: .28;
  }

  .shell {
    padding: .75rem;
  }

  .header .hud-inner {
    grid-template-columns: minmax(0, 1fr) auto;
    gap: .65rem;
  }

  .hud-brand span {
    display: none;
  }

  .hud-progress span {
    flex: 1 1 auto;
    text-align: center;
  }

  .hud-home {
    padding-inline: .65rem;
    font-size: .86rem;
  }

  .game-frame,
  .hero {
    margin: 1rem auto;
    border-width: 4px;
    outline-width: 3px;
    box-shadow: 6px 6px 0 #07273d59;
  }

  .game-screen {
    padding: 1rem .8rem 1.25rem;
  }

  .metrics,
  .views,
  .resources,
  .options,
  .rule-cards {
    grid-template-columns: minmax(0, 1fr);
  }

  .panel,
  details,
  .metric,
  .option,
  .rule-card {
    max-width: 100%;
  }

  .actions button {
    width: 100%;
  }

  .result-metric strong {
    font-size: 1.08rem;
  }

  .screen-heading h1 {
    font-size: clamp(1.55rem, 9vw, 2.2rem);
  }

  .turn-title {
    font-size: 1.1rem;
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    scroll-behavior: auto !important;
    animation-duration: .001ms !important;
    animation-iteration-count: 1 !important;
    animation: none !important;
    transition: none !important;
  }
}

@media print {
  :root {
    --game-white: #000;
    --game-screen: #fff;
    --game-panel: #fff;
    --game-panel-strong: #fff;
  }

  body {
    background: #fff !important;
    color: #000 !important;
  }

  body::before,
  body::after,
  .game-frame::before,
  .game-frame::after,
  .ending-decoration,
  .stage-decoration {
    display: none !important;
  }

  .header,
  .no-print,
  .reflection,
  .history {
    display: none !important;
  }

  .game-frame,
  .hero,
  .panel,
  details,
  .management-log {
    margin: 0;
    border: 1px solid #555;
    outline: 0;
    background: #fff !important;
    box-shadow: none;
    color: #000 !important;
    clip-path: none;
  }

  .game-screen,
  .metric,
  .view,
  .resource,
  .option,
  .rule-card {
    background: #fff !important;
    color: #000 !important;
  }

  h1,
  h2,
  h3,
  h4,
  p,
  li,
  strong,
  span,
  .screen-kicker,
  .result-title,
  .final-result,
  .score,
  .rank-badge {
    color: #000 !important;
    text-shadow: none !important;
  }

  .only-print {
    display: block;
  }

  .presentation {
    max-width: none;
  }
}

function introduction(){const i=data.introduction,nf=data.initialState.nonFinancial,m={safety:toPhase2TenPointScore(nf.safety),cashRunway:createPhase2RunwayDisplay(data.initialDisplay.cashRunwayQuarters),operatingProfit:0,customerSatisfaction:toPhase2TenPointScore(nf.customerSatisfaction),employeeState:toPhase2TenPointScore(nf.employeeState),futureGrowth:toPhase2TenPointScore(nf.futureGrowth)};return`<main class="shell mission-screen">${gameFrame(`${screenHeading('MISSION','ゲーム説明')}<p class="mission-copy">あなたは未来つくり鉄道の経営チームです</p><div class="rule-cards" aria-label="重要なゲームルール"><article class="rule-card"><span>01</span><strong>3年間・全12ターン</strong><small>設備は経年劣化します。</small></article><article class="rule-card"><span>02</span><strong>毎回3つの経営案から選択</strong></article><article class="rule-card"><span>03</span><strong>安全と資金は必須条件</strong></article><article class="rule-card"><span>04</span><strong>年度ごとに経営点数を発表</strong></article></div><details class="panel info-panel"><summary>会社の状況とプレイヤーの役割</summary><h2>会社の状況</h2><p>${esc(i.companySituation)}</p><h2>プレイヤーの役割</h2><p>${esc(i.playerRole)}</p></details><details class="panel info-panel"><summary>ゲームで見る6項目と必須条件</summary><h2>ゲームで見る6項目</h2>${metricCards(m,true,data.initialState.internalMetrics.informationSecurityLevel)}<h3>必須条件</h3><p><strong>最終安全8/10以上、最終資金6か月以上。</strong><br>安全と資金は、他の得点では補えません。</p></details><section class="panel money-learning"><h2>利益・現金・借金の違い</h2><div class="money-learning-grid"><article><strong>営業利益</strong><p>本業でどれだけ利益が出たか</p></article><article><strong>現金</strong><p>今、会社が実際に使えるお金</p></article><article><strong>会社の借金（借入金）</strong><p>銀行などから借りていて、将来返す必要があるお金</p></article></div><p><strong>借入をすると現金は増えますが、売上や利益が増えたわけではありません。</strong></p><p>鉄道会社は車両・駅・線路・安全設備など長期間使う設備への投資で借入を利用することがあります。借金がある＝経営失敗ではありません。何に使うか、返せる余力があるかが重要です。</p><p>CFOの視点では、利益だけでなく、現金と借入のバランスを見ます。</p></section><details class="panel info-panel"><summary>資金の残り期間を詳しく見る</summary><h2>資金の残り期間</h2><p>${esc(runwayMonths(i.runwayGuide.meaning))}</p>${workingCapitalExplanation(data.runwayModel.standardQuarterlyCashNeed,2,20)}${list([`${runwayMonths(i.runwayGuide.danger)}・クリア条件未達`,`${runwayMonths(i.runwayGuide.caution)}・クリア条件達成`,`${runwayMonths(i.runwayGuide.comfortable)}・クリア条件達成`,runwayMonths(i.runwayGuide.minimum),runwayMonths(i.runwayGuide.comfortableTarget)])}<p>${esc(i.runwayGuide.financingNote)}</p></details><section class="panel mission-start"><h2>点数発表</h2><p>各年度の経営点数は、その年度の4つの判断が終わった後に発表されます。</p><p>3年間の総合経営点数と最終判定は、全12ターンが終わった後に発表されます。</p><div class="actions"><button data-action="to-practice">操作練習へ</button></div></section>`,'mission-frame')}</main>`;}

function practiceResult(){const r=save.practice.result,m=r.metrics,secondary=[['お客さま満足',m.customerSatisfaction],['社員の状態',m.employeeState],['将来性',m.futureGrowth]].filter(([name])=>r.affectedNonFinancialMetrics.includes({お客さま満足:'customerSatisfaction',社員の状態:'employeeState',将来性:'futureGrowth'}[name])).map(([name,v])=>resultMetric(name,v.before,v.after,'/10')).join(''),runwayState=resultState(m.cashRunway.before.cashRunwayQuarters,m.cashRunway.after.cashRunwayQuarters),signed=value=>`${num(value)>0?'+':''}${num(value)}億円`,financeNote=r.cashFlows.financing>0?'<p class="debt-note"><strong>借入で現金を補いました。</strong> 借入による入金は営業利益ではなく、将来返す必要があるお金です。</p>':r.cashFlows.investing<0?'<p class="debt-note">設備投資を手元の現金で支払いました。借入金は増えていません。</p>':'<p class="debt-note">本業による現金の増加です。借入によって増えた現金ではありません。</p>';return`<main class="shell tutorial-result-screen">${gameFrame(`${screenHeading('TUTORIAL RESULT','操作練習の結果')}<section class="panel"><h2>選んだ案：${esc(r.option.name)}</h2><p class="result-message">${esc(r.resultText)}</p><h2>会社状態の変化</h2><div class="grid metrics primary-metrics">${resultMetric('安全',m.safety.before,m.safety.after,'/10')}<article class="metric result-metric ${runwayState[2]}"><span class="result-badge">${runwayState[0]}・${runwayState[1]}</span><span>資金の残り期間</span><strong>${runwayMonths(m.cashRunway.before.display)} → ${runwayMonths(m.cashRunway.after.display)}</strong></article>${resultMetric('営業利益',m.operatingProfit.before,m.operatingProfit.after,'億円')}</div>${secondary?`<div class="grid metrics secondary-metrics result-company-state">${secondary}</div>`:''}<section class="money-change"><h2>今回のお金の変化</h2><div class="grid metrics money-change-grid">${resultMetric('現金',m.cash.before,m.cash.after,'億円')}${resultMetric('会社の借金（借入金）',m.debt.before,m.debt.after,'億円')}</div><p class="cashflow-note">CF＝キャッシュフロー。実際の現金の動きを表します。</p><div class="grid metrics"><article class="metric">営業CF（本業による現金の出入り）<strong>${signed(r.cashFlows.operating)}</strong></article><article class="metric">投資CF（設備投資などによる現金の出入り）<strong>${signed(r.cashFlows.investing)}</strong></article><article class="metric">財務CF（借入・返済による現金の出入り）<strong>${signed(r.cashFlows.financing)}</strong></article></div>${financeNote}</section><h2>ここで学ぶこと</h2>${list(r.learningExplanation)}<p><strong>設備投資は現金を減らしますが、購入時にすべてが費用になるとは限りません。</strong></p><p class="tutorial-notice">この練習結果は本編には影響しません。</p><button data-action="start-main">本編を始める</button></section>`,'tutorial-result-frame')}</main>`;}
function turn(){const v=createPhase2CurrentTurnPublicView(data,save.session),f=v.financialDetails,mode=v.isMajorEvent?'major-event-screen emergency-screen':'standard-turn-screen';return`<main class="shell decision-shell">${yearStartBanner(v)}${gameFrame(`${screenHeading(v.isMajorEvent?'EMERGENCY EVENT':'MANAGEMENT TURN',v.isMajorEvent?'大規模イベント':'通常の経営判断')}<p class="turn-title">${esc(v.eventName)}</p><section class="panel status-panel"><h2>現在の会社状態</h2>${primaryMetricCards(v.visibleMetrics)}${securityStatusLine()}<section class="money-position"><h3>お金の状況</h3><div><p><span>現金残高</span><strong>${num(f.cash)}億円</strong></p><p><span>会社の借金（借入金）</span><strong>${num(f.debt)}億円</strong></p></div></section><h3>会社全体の状態</h3>${secondaryMetricCards(v.visibleMetrics)}</section>${v.isMajorEvent?`<section class="panel news emergency-news"><div class="emergency-heading"><span class="warning-lamp" aria-hidden="true"></span><h2>緊急ニュース</h2></div><p>${esc(v.railNews)}</p></section>`:''}<section class="panel decision-panel"><div class="decision-copy"><h2>現在の経営課題</h2><p>${esc(v.managementIssue)}</p><h2>今回決めること</h2><p>${esc(v.decisionPrompt)}</p></div><details><summary>詳しい判断材料を見る</summary><h3>分かっていること</h3>${list(v.confirmedInformation)}<h3>まだ分からないこと</h3>${list(v.uncertainSignals)}<h3>判断前の3つの視点</h3>${views(v.perspectives)}</details><h2>経営会議</h2>${optionCards(v.options,save.draftDecision.optionId)}<p class="effect-preview-note">※見込みは判断時点の予測です。実際の結果は、これまでの経営判断や会社の状態、発生する出来事によって変わることがあります。</p><div class="actions confirm-actions"><button data-action="turn-confirm" ${save.draftDecision.optionId?'':'disabled'}>選択を確定</button></div></section>`,'management-screen '+mode)}</main>`;}

lass="debt-note">借入によって現金を確保しました。借入金は営業利益ではなく、将来返す必要があります。</p>':r.moneyPosition.debt.after<r.moneyPosition.debt.before?'<p class="debt-note">返済によって会社の借金（借入金）が減りました。</p>':''}</section><h2>会社状態の変化</h2><div class="grid metrics secondary-metrics result-company-state">${resultMetric('お客さま満足',b.customerSatisfaction,a.customerSatisfaction,'/10')}${resultMetric('社員の状態',b.employeeState,a.employeeState,'/10')}${resultMetric('将来性',b.futureGrowth,a.futureGrowth,'/10')}</div>${r.safetyAging?'<p class="aging-message">設備は経年劣化します。</p>':''}<p class="status">資金の状態：${esc(a.cashRunway.status)}</p><h2>次の判断へ残る影響</h2><p>${esc(r.carryoverRisk)}</p></section><details class="panel"><summary>その他の会社状態・詳しい財務を見る</summary><h2>その他の会社状態</h2><div class="grid metrics secondary-metrics">${delta('お客さま満足',b.customerSatisfaction,a.customerSatisfaction,'/10')}${delta('社員の状態',b.employeeState,a.employeeState,'/10')}${delta('将来性',b.futureGrowth,a.futureGrowth,'/10')}</div><h2>詳細なキャッシュフロー</h2><p class="cashflow-note">CF＝キャッシュフロー。実際の現金の動きを表します。</p><div class="grid metrics"><article class="metric">現金の増減<strong>${num(m.cash)}億円</strong></article><article class="metric">営業利益の増減<strong>${num(m.operatingProfit)}億円</strong></article><article class="metric">営業CF（本業による現金の出入り）<strong>${num(m.operatingCashFlow)}億円</strong></article><article class="metric">投資CF（設備投資などによる現金の出入り）<strong>${num(m.investingCashFlow)}億円</strong></article><article class="metric">財務CF（借入・返済による現金の出入り）<strong>${num(m.financingCashFlow)}億円</strong></article></div>${r.liquiditySupport?'<div class="error"><p><strong>現金不足を防ぐため、自動緊急支援として借入を行いました。</strong></p><p>借入は当面の現金を確保しますが、将来の返済と信用余力に影響します。</p></div>':''}<h2>経営資源への影響</h2><div class="grid resources">${Object.entries({people:'ヒト',assets:'モノ',money:'カネ',information:'情報'}).map(([k,n])=>`<article class="resource"><h3>${n}</h3><p>${esc(r.resourceImpact[k])}</p></article>`).join('')}</div><h2>現場・財務・経営の各視点</h2>${views(r.perspectives)}</details><div class="actions"><button data-action="result-next">${save.session.pendingReview?`${r.year}年目の経営評価へ`:'次のターンへ'}</button></div>`,'decision-result-screen '+(r.isMajorEvent?'event-result-screen':'normal-result-screen'))}</main>`;}
function annualReview(){const snap=save.session.annualSnapshots.at(-1),a=createAnnualPublicResult(snap),m=a.visibleMetrics,financial=save.session.state.financial.balanceSheet;return`<main class="shell annual-review-shell">${gameFrame(`${screenHeading(`YEAR ${a.year} COMPLETE`,`${a.year}年目の経営評価`)}<p class="stage-label">${a.year}年目終了</p><section class="panel stage-score-panel"><div class="stage-decoration" aria-hidden="true">${pixelIcon('trophy')}<span>★ ★ ★</span></div><h2>経営点数</h2><div class="score">${a.score} / 100点</div><meter class="score-gauge" min="0" max="100" value="${a.score}">${a.score}点</meter><h2>経営ランク</h2><div class="rank-badge">${esc(a.rank.rank)}</div><p>${esc(a.rank.label)}</p><h2>年末の会社状態</h2>${annualMetricCards(m)}${securityAnnualSummary(a.year)}<h2>年末のお金の状況</h2><div class="money-position"><div><p><span>現金残高</span><strong>${num(financial.assets.cash)}億円</strong></p><p><span>会社の借金（借入金）</span><strong>${num(financial.liabilities.debt)}億円</strong></p></div></div><h2>必須条件</h2><p>${a.mandatoryConditions.safetyAchieved?'○ 安全　達成':'× 安全　未達'}</p><p>${a.mandatoryConditions.runwayAchieved?'○ 資金　達成':'× 資金　未達'}</p><h2>来年度の注目点</h2>${list(a.attentionPoints.length?a.attentionPoints:['現在の強みを維持しながら、次年度の変化へ備えましょう。'])}<button data-action="annual-next">${a.year===3?'3年間の最終評価へ':'次の年度へ進む'}</button></section>`,'stage-clear-screen')}</main>`;}
function financialPolicy(){const view=createPhase2FinancialPolicyPreview(data,save.session),quarterlyNeed=num(data.runwayModel.standardQuarterlyCashNeed),minimumRunwayQuarters=Math.floor(view.minimumCashAfterRepayment/quarterlyNeed);return`<main class="shell financial-policy-shell">${gameFrame(`${screenHeading('NEW YEAR POLICY','新年度の財務方針')}<section class="panel"><p><strong>${view.year}年目を始める前に、会社の借金（借入金）を返済するか決めます。</strong></p><p>返済後も、すぐ使える現金を${num(view.minimumCashAfterRepayment)}億円以上残す必要があります。0億円返済は現金額にかかわらず選べます。</p>${workingCapitalExplanation(quarterlyNeed,minimumRunwayQuarters,view.minimumCashAfterRepayment)}<div class="grid options financial-policy-options" aria-label="返済額の選択">${view.options.map(option=>`<label class="option ${save.draftFinancialPolicy.optionId===option.id?'selected':''} ${option.available?'':'disabled'}"><input type="radio" name="financial-policy" value="${esc(option.id)}" ${save.draftFinancialPolicy.optionId===option.id?'checked':''} ${option.available?'':'disabled'}><h3>${num(option.repayment)}億円返済</h3><p>${esc(option.repayment===0?'借入金を返済せず現金を残す':option.description)}</p><div class="policy-preview"><p>現金　<strong>${num(option.cash.before)}億円 → ${num(option.cash.after)}億円</strong></p><p>会社の借金（借入金）　<strong>${num(option.debt.before)}億円 → ${num(option.debt.after)}億円</strong></p><p>資金の残り期間　<strong>${runwayMonths(option.cashRunway.before.display)} → ${runwayMonths(option.cashRunway.after.display)}</strong></p><p>営業利益　<strong>変化なし</strong></p></div>${option.unavailableReason?`<p class="error" role="status">選択不可：${esc(option.unavailableReason)}</p>`:''}</label>`).join('')}</div><div class="actions"><button data-action="financial-policy-confirm" ${save.draftFinancialPolicy.optionId?'':'disabled'}>財務方針を確定</button></div></section>`,'financial-policy-screen')}</main>`;}
function financialPolicyResult(){const r=save.lastFinancialPolicyResult;return`<main class="shell financial-policy-result-shell">${gameFrame(`${screenHeading('POLICY RESULT','新年度の財務方針の結果')}<section class="panel"><h2>${num(r.repayment)}億円返済を選びました</h2><p class="result-message">${esc(r.description)}</p><div class="money-change"><h2>お金の変化</h2><div class="grid metrics">${delta('現金',r.cash.before,r.cash.after,'億円')}${delta('会社の借金（借入金）',r.debt.before,r.debt.after,'億円')}<article class="metric"><span>資金の残り期間</span><strong>${runwayMonths(r.cashRunway.before.display)} → ${runwayMonths(r.cashRunway.after.display)}</strong></article><article class="metric"><span>営業利益</span><strong>変化なし</strong></article><article class="metric"><span>財務CF（借入・返済による現金の出入り）</span><strong>${r.financingCashFlow}億円</strong></article></div></div><p><strong>CF＝キャッシュフローで、実際の現金の動きを表します。財務CFは、借入や返済など「資金調達に関する現金の動き」です。${r.repayment>0?`今回は借入金を${num(r.repayment)}億円返済したため、会社から現金${num(r.repayment)}億円が出ていき、財務CFは−${num(r.repayment)}億円になります。`:`今回は返済を行っていないため、財務CFは0億円です。`}</strong></p><p><strong>借入金の返済は費用ではないため営業利益は減りません。一方、返済には現金を使うため、会社がすぐ使えるお金は減ります。</strong></p><button data-action="financial-policy-next">${num(r.year)}年目の経営を始める</button></section>`,'financial-policy-result-screen')}</main>`;}
function finalReview(){const financial=save.session.state.financial.balanceSheet,f=createPhase2FinalPublicView(save.session),type=evaluatePhase2ManagementType(save.session),tags=evaluatePhase2ManagementTags(save.session),hist=createPhase2HistoryPublicView(data,save.session);return`<main class="shell final-review-shell">${gameFrame(`${screenHeading('3 YEARS COMPLETE','3年間の経営、おつかれさまでした')}<section class="panel final-summary"><div class="ending-decoration" aria-hidden="true">${pixelIcon('trophy')}${pixelIcon('train')}<span>★ ★ ★</span></div><h2>最終判定</h2><div class="final-result">${esc(f.displayName)}</div><h2>総合経営点数</h2><div class="score">${f.totalScore} / 100点</div><h2>最終ランク</h2><div class="rank-badge">${esc(f.rank.rank)}</div><p class="rank-label">${esc(f.rank.label)}</p><h2>年ごとの経営点数</h2>${list(Object.entries(f.annualScores).map(([k,v])=>`${k.replace('year','')}年目　${v}点`))}<h2>3年目終了時の会社</h2>${annualMetricCards(f.finalVisibleMetrics)}<h2>最終のお金の状況</h2><div class="money-position"><div><p><span>現金残高</span><strong>${num(financial.assets.cash)}億円</strong></p><p><span>会社の借金（借入金）</span><strong>${num(financial.liabilities.debt)}億円</strong></p></div></div><h2>経営タイプ</h2><h3>${esc(type.name)}</h3><p>${esc(type.description)}</p><h2>あなたの経営の特徴</h2><p class="management-tags-note">3年間の判断や会社の状態から見える特徴です。点数やクリア条件には直接影響しません。</p><div class="management-tags">${tags.length?tags.map(t=>`<span class="tag" title="${esc(t.description)}">${esc(t.name)}</span>`).join(''):'該当なし'}</div><h2>判定理由</h2>${list(f.reasons.length?f.reasons:['安全・資金・年度点・総合点を基に判定しました。'])}</section>`,'ending-screen final-screen')}<section class="panel history management-log"><p class="screen-kicker">MANAGEMENT LOG</p><h2>判断履歴</h2>${hist.map(h=>`<article><strong>${h.year}年目 第${h.quarter}四半期　${esc(h.eventName)}</strong><p>選んだ案：${esc(h.selectedOption)}</p><p>${esc(h.resultText)}</p><p>資金の残り期間：${esc(runwayMonths(h.runway))}</p>${h.causalExplanations.map(x=>`<p>${esc(x)}</p>`).join('')}</article>`).join('')}${(save.session.financialPolicyHistory??[]).map(h=>`<article><strong>${h.year}年目 新年度の財務方針</strong><p>選んだ方針：${num(h.repayment)}億円返済</p><p>現金：${num(h.cash.before)}億円 → ${num(h.cash.after)}億円／会社の借金（借入金）：${num(h.debt.before)}億円 → ${num(h.debt.after)}億円</p></article>`).join('')}</section><section class="panel reflection"><p class="screen-kicker">REVIEW</p><h2>振り返り</h2>${[['q1','最も迷った経営判断は何ですか'],['q2','利益と現金の違いを強く感じた場面はどこですか'],['q3','安全・社員・お客さま・将来性の中で、何を優先しましたか'],['q4','現実の仕事に持ち帰りたい学びは何ですか']].map(([k,q])=>`<label>${q}<textarea data-reflection="${k}">${esc(save.reflection[k])}</textarea></label>`).join('')}<div class="actions"><button data-action="save-reflection">振り返りを保存</button><button data-action="presentation">発表用結果カード</button></div></section></main>`;}
function presentation(){const financial=save.session.state.financial.balanceSheet,f=createPhase2FinalPublicView(save.session),type=evaluatePhase2ManagementType(save.session),tags=evaluatePhase2ManagementTags(save.session);return`<main class="shell presentation">${gameFrame(`${screenHeading('RESULT CARD','3年間の経営結果')}<section class="panel presentation-card"><p class="eyebrow">未来つくり鉄道</p><h2>最終判定</h2><div class="final-result">${esc(f.displayName)}</div><div class="score">${f.totalScore} / 100点</div><h2>${esc(f.rank.rank)}ランク　${esc(f.rank.label)}</h2>${list(Object.entries(f.annualScores).map(([k,v])=>`${k.replace('year','')}年目　${v}点`))}<p><strong>最終安全：</strong>${num(f.finalVisibleMetrics.safety)}/10</p><p><strong>最終現金：</strong>${num(financial.assets.cash)}億円</p><p><strong>会社の借金（借入金）：</strong>${num(financial.liabilities.debt)}億円</p><p><strong>最終ランウェイ：</strong>${runwayMonths(`${num(f.finalVisibleMetrics.cashRunwayQuarters)}四半期`)}</p><p><strong>経営タイプ：</strong>${esc(type.name)}</p><p><strong>経営の特徴：</strong>${tags.map(t=>esc(t.name)).join('、')||'該当なし'}</p><div class="actions no-print"><button data-action="print">印刷する</button><button data-action="final">最終評価へ戻る</button><button class="secondary" data-action="restart">最初から始める</button></div></section>`,'presentation-frame')}</main>`;}
function selftest(){return`<main class="shell selftest-shell">${gameFrame(`${screenHeading('SYSTEM CHECK','Phase 2セルフチェック')}<section class="panel">${list(['本番データ：正常','12ターン：正常','保存機能：利用可能','年度評価：利用可能','最終評価：利用可能','外部依存：なし','総合判定：利用可能'])}</section>`,'selftest-screen')}</main>`;}
function render(){const body=new URLSearchParams(location.search).get('selftest')==='1'?selftest():({top:renderTopScreen, introduction,practice,practiceResult,turn,turnResult,annualReview,financialPolicy,financialPolicyResult,finalReview,reflection:finalReview,presentation,saveError:()=>`<main class="shell"><section class="panel error"><h1>保存データを読み込めませんでした。最初から開始してください。</h1><button data-action="clear-save">保存を削除</button></section></main>`}[save.screen]??renderTopScreen)();root.innerHTML=header()+backNavigation()+body;bind();}
function bind(){root.querySelectorAll('input[name=option]').forEach(el=>el.addEventListener('change',()=>{if(save.screen==='practice')save.practice.selectedOptionId=el.value;else save.draftDecision.optionId=el.value;persist();render();}));root.querySelectorAll('input[name=financial-policy]').forEach(el=>el.addEventListener('change',()=>{save.draftFinancialPolicy.optionId=el.value;persist();render();}));root.querySelectorAll('[data-reflection]').forEach(el=>el.addEventListener('input',()=>{save.reflection[el.dataset.reflection]=el.value;persist();}));root.querySelectorAll('[data-action]').forEach(el=>el.addEventListener('click',()=>act(el.dataset.action)));}
function checkpoint(){save=pushPhase2NavigationCheckpoint(save);}
function reset(screen='introduction'){const session=createThreeYearSession(data);save=createPhase2BrowserSave(session,'top');save.resumeScreen=screen;checkpoint();save.screen=screen;persist();render();}
function act(action){if(busy)return;
if(action==='new'||action==='restart'){if(safeStorage.getItem(PHASE2_STORAGE_KEY)&&!confirm('保存済みの進行を消して最初から始めますか？'))return;reset();return;}
if(action==='resume'){const raw=safeStorage.getItem(PHASE2_STORAGE_KEY);if(!raw)return;const n=normalizePhase2BrowserSave(JSON.parse(raw),data);if(!n.compatible){save.screen='saveError';render();return;}save=n.save;save.screen=save.resumeScreen??save.screen;render();return;}
if(action==='back'||action==='final'){const currentScreen=save.screen;save=restorePreviousPhase2NavigationCheckpoint(save);if(save.screen==='top')save.resumeScreen=currentScreen;persist();render();return;}
if(action==='top'){save.resumeScreen=save.screen;save.screen='top';persist();render();return;}
if(action==='to-practice'){checkpoint();save.screen='practice';persist();render();return;}
if(action==='practice-confirm'){const option=data.practiceModule.options.find(o=>o.id===save.practice.selectedOptionId);if(!option||!confirm(`「${option.name}」で確定しますか？`))return;checkpoint();save.practice.result=resolvePhase2PracticeChoice(data,option.id);save.practice.completed=true;save.screen='practiceResult';persist();render();return;}
if(action==='start-main'){checkpoint();save.screen='turn';persist();render();return;}
if(action==='turn-confirm'){const view=createPhase2CurrentTurnPublicView(data,save.session),option=view.options.find(o=>o.id===save.draftDecision.optionId);if(!option||!confirm(`「${option.name}」で確定しますか？`))return;busy=true;try{checkpoint();const before=structuredClone(save.session),commandId=sequence(`turn-${view.turnId}`);save.session=resolvePhase2Turn(data,save.session,{commandId,turnId:view.turnId,optionId:option.id});save.lastResult=createPhase2TurnResultPublicView(data,before,save.session);save.draftDecision={optionId:null};save.screen='turnResult';persist();render();}finally{busy=false;}return;}
if(action==='result-next'){checkpoint();save.screen=save.session.pendingReview?'annualReview':'turn';persist();render();return;}
if(action==='annual-next'){busy=true;try{checkpoint();save.session=acknowledgePhase2Review(save.session,sequence(`review-${save.session.pendingReview?.year??'final'}`));save.screen=save.session.pendingReview?.type==='FINAL'?'finalReview':save.session.pendingFinancialPolicy?'financialPolicy':'turn';persist();render();}finally{busy=false;}return;}
if(action==='financial-policy-confirm'){const view=createPhase2FinancialPolicyPreview(data,save.session),option=view.options.find(item=>item.id===save.draftFinancialPolicy.optionId);if(!option||!option.available||!confirm(`「${option.repayment}億円返済」で確定しますか？`))return;busy=true;try{checkpoint();save.session=confirmPhase2FinancialPolicy(data,save.session,{commandId:sequence(`financial-policy-y${view.year}`),optionId:option.id});save.lastFinancialPolicyResult={...option,year:view.year,financingCashFlow:-option.repayment};save.draftFinancialPolicy={optionId:null};save.screen='financialPolicyResult';persist();render();}finally{busy=false;}return;}
if(action==='financial-policy-next'){checkpoint();save.screen='turn';persist();render();return;}
if(action==='presentation'){checkpoint();save.screen='presentation';persist();render();return;}
if(action==='save-reflection'){persist();render();return;}
if(action==='print'){print();return;}
if(action==='clear-save'){safeStorage.removeItem(PHASE2_STORAGE_KEY);save=createPhase2BrowserSave(createThreeYearSession(data),'top');render();}}
function renderFatalError(error){const target=root??document.querySelector('#root');if(!target)return;const name=esc(error?.name||'Error'),message=esc(typeof error?.message==='string'?error.message:'読み込み処理でエラーが発生しました。');target.innerHTML=`<main class="shell"><section class="panel error"><h1>ゲームの読み込みに失敗しました。</h1><p>ファイルを再ダウンロードするか、別のブラウザで開いてください。</p><details><summary>開発者向け情報</summary><p>${name}: ${message}</p></details></section></main>`;}
async function boot(){root=document.querySelector('#root');data=globalThis.RAIL_PHASE2_GAME_DATA??await fetch('/game-data/PHASE2_3YEAR_GAME_DATA.json').then(r=>r.json());const raw=safeStorage.getItem(PHASE2_STORAGE_KEY);if(raw){try{const normalized=normalizePhase2BrowserSave(JSON.parse(raw),data);save=normalized.compatible?normalized.save:{...createPhase2BrowserSave(createThreeYearSession(data),'saveError')};}catch{save=createPhase2BrowserSave(createThreeYearSession(data),'saveError');}}else save=createPhase2BrowserSave(createThreeYearSession(data),'top');render();}
if(typeof document!=='undefined')boot().catch(renderFatalError);
</script></body></html>
