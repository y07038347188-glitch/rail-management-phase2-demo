/* v1.7: Phase2 (original) retro menu + decision-game skin. Simulation engine unchanged. */
:root{--retro-sky:#68b9ee;--retro-screen:#07111e;--retro-border:#05090f;--retro-panel:#10253a;--retro-white:#f8fbff;--retro-blue:#2f9df4;--retro-green:#38ce7a;--retro-gold:#ffd45a;--retro-muted:#abc0d1;--retro-red:#ff5b57;--retro-focus:#fff27a}
html{background:#68b9ee}
body{color:#f8fbff;background:radial-gradient(ellipse 80px 28px at 12% 10%, #ffffffc0 0 58%, transparent 60%),radial-gradient(ellipse 105px 34px at 76% 15%, #ffffffbd 0 58%, transparent 60%),linear-gradient(166deg, transparent 0 72%, #4e94a3 72.2% 78%, transparent 78.2%),linear-gradient(194deg, transparent 0 74%, #357984 74.2% 82%, transparent 82.2%),linear-gradient(180deg,#72c8f7 0,#68b9ee 62%,#b8e2f3 100%)}
#app{width:min(100%,640px);height:100dvh;min-height:0;max-height:100dvh;margin:auto;padding:8px 9px calc(8px + env(safe-area-inset-bottom));gap:0;overflow:hidden;display:block}
.retro-cabinet{height:100%;min-height:0;display:flex;flex-direction:column;position:relative;background:var(--retro-border);border:5px solid var(--retro-border);border-radius:7px;box-shadow:0 10px 0 #0b22313b;overflow:hidden}
.retro-screen{min-height:0;flex:1 1 auto;background:var(--retro-screen);border:5px solid var(--retro-white);display:flex;flex-direction:column;color:var(--retro-white)}
.retro-floor{height:64px;min-height:38px;flex:0 0 64px;background:repeating-linear-gradient(90deg,#8b5d3b 0 18px,#537a52 18px 44px,#8b5d3b 44px 54px,#547953 54px 80px),linear-gradient(180deg,#dcaa71,#a17147);border:5px solid var(--retro-white);border-top:0;box-shadow:inset 0 0 0 1px #24371d}
.retro-title{align-items:center;justify-content:space-between;padding:clamp(16px,3.5dvh,36px) 25px 20px;text-align:center;gap:0}
.front-loco{flex:0 0 auto;margin:auto auto 4px;transform:scale(.9);filter:drop-shadow(4px 6px 0 #000)}
.intro-kicker{font-size:clamp(13px,2.4vw,17px);font-weight:900;color:#b9cddd;line-height:1.5;white-space:nowrap}

.start-btn{min-height:69px;border-radius:2px!important;border:4px solid #fff!important;box-shadow:5px 6px 0 #000!important;font-size:clamp(18px,4.5vw,23px)!important;font-weight:950;color:var(--retro-white);background:var(--retro-blue);width:100%;line-height:1.15}

.game-mode .score{border-right:1px solid #45627c;min-width:0}.game-mode .score small{font-size:10px;color:#abc0d1}.game-mode .score b{font-size:19px;color:#fff}.game-mode .score.cash b{color:#ffd45a}.game-mode .score em{font-size:10px}

 if(auto){return `<div class="eyebrow">YEAR ${s.year}・Q${s.q} ｜ 自動イベント</div><h1 class="title">情報セキュリティ事故が発生</h1><p class="lead">過去の教育投資${future.training}億円分を反映し、今回の事故損失を計算します。</p><div class="cashbook"><div class="line"><span>対策なしの場合の損失</span><strong>5億円</strong></div><div class="line"><span>教育による被害軽減</span><strong class="plus">−${Math.min(3,future.training)}億円</strong></div><div class="line total"><span>今回の事故損失</span><strong>${5-Math.min(3,future.training)}億円</strong></div></div><div class="actions"><button class="btn" data-act="auto">事故の影響を確認 ▶</button></div>`}
 return `<div class="eyebrow">YEAR ${s.year}・Q${s.q} ｜ ${e.shock?'緊急イベント':'経営判断'}</div><h1 class="title">${esc(e.title)}</h1><p class="lead">${esc(e.story)}</p>${s.q===1?`<div class="banner">年初は、売掛金の回収・買掛金の支払い・借入返済を先に精算します。自己資金が足りない投資は選べません。</div>`:''}<div class="choice-list">${e.opts.map((o,i)=>{const p=preview(i),locked=!!p.failed;return `<button class="choice ${picked===i?'active':''}" ${locked?'disabled':''} data-act="select" data-n="${i}" aria-pressed="${picked===i}"><span class="letter">${'ABC'[i]}</span><span class="choice-t"><strong>${esc(o.label)}</strong><small>${o.cost?`費用 ${o.cost}億円`:'追加費用 0億円'}${o.loan?` ／ 借入＋${o.loan}億円`:''}<br>${esc(o.desc)}</small></span>${locked?'<span class="lock">実行不可</span>':''}</button>`}).join('')}</div>${picked!=null?forecastPanel(preview(picked),e.opts[picked]):`<div class="hint">3つの選択肢から1つを選ぶと、下に「選択後の見込み」が表示されます。</div>`}<div class="actions"><button class="btn" data-act="execute" ${picked==null||preview(picked).failed?'disabled':''}>${picked!=null?`「${esc(e.opts[picked].label)}」を実行 ▶`:'方針を選んでください'}</button></div>`}
function result(){const d=s.last;if(!d?.flows)return `<p>決算データを確認できません。</p>`;return `<div class="eyebrow">YEAR ${d.year}・Q${d.q} ｜ 今期の結果</div><h1 class="title">${esc(d.option)}</h1>${d.shockLabel?`<div class="banner">⚠️ ${esc(d.shockLabel)}</div>`:''}<div class="cashbook"><div class="line"><span>今期開始時の現金</span><strong>${fmt(d.before)}</strong></div>${d.flows.filter(x=>!x.accounting).map(f=>`<div class="line"><span>${esc(f.label)}</span><strong class="${f.n>0?'plus':f.n<0?'minus':''}">${sign(f.n)}</strong></div>`).join('')}<div class="line total"><span>今期終了時の現金</span><strong>${fmt(d.after)}</strong></div></div><div class="impact"><strong>重要な3項目の変化</strong>${deltaCards(d)}<div class="short">利益は発生時に計上され、売上代金の入金は原則翌四半期です。設備投資は今期の現金を減らし、固定資産としてB/Sに残ります。</div></div><div class="actions"><button class="btn" data-act="advance">${s.q===4?'年度末の経営評価へ ▶':'次の経営判断へ ▶'}</button></div>`}
function financial(){const p=s.pl,cf=s.cf,bs=totals(s);const score=currentScore(),[rank,label]=gradeInfo(score);const plrows=[['売上高',p.revenue],['人件費',-p.payroll],['運営費',-p.operations],['その他経費・災害対応',-p.event-p.levies],['減価償却費',-p.depreciation],['営業利益',operatingProfit(s),1],['利息・法人税',-p.interest-p.tax],['当期利益',yearProfit(s),1]];const bsrows=[['現金',s.cash],['売掛金',s.ar],['その他資産',s.otherAssets],['固定資産',s.fixed],['資産合計',bs.assets,1],['負債（長期・短期ほか）',s.longDebt+s.shortDebt+s.otherLiab+s.ap],['純資産',s.equity],['負債＋純資産',bs.liability,1]];const cfrows=[['営業活動による現金',cf.operating],['設備投資による現金',cf.investing],['借入・返済による現金',cf.financing],['現金の増減',cf.operating+cf.investing+cf.financing,1],['期首現金',s.yearOpenCash],['期末現金',s.cash,1]];const data={pl:{title:'P/L｜今年いくら儲かった？',rows:plrows,note:'利益には、まだ入金されていない売上も含まれます。'},bs:{title:'B/S｜会社の財産と借金',rows:bsrows,note:'設備投資は固定資産になり、現金の支払いとは別に記録されます。'},cf:{title:'C/F｜現金はどう動いた？',rows:cfrows,note:'黒字でも、設備投資や借入返済で現金が減ることがあります。'}};const sel=data[s.tab]||data.pl;return `<div class="eyebrow">YEAR COMPLETE</div><div class="annual-subtitle"><h1 class="title">${s.year}年目の経営評価</h1><span class="year-tag">${s.year}年目終了</span></div><div class="summary-card"><div class="summary-top"><div class="score-box"><small>経営点数</small><b>${score}/100点</b><div class="score-bar"><span style="width:${score}%"></span></div></div><div class="rank-card"><small>経営ランク</small><div class="rank-badge">${rank}</div><div>${label}</div></div></div><h2 class="title" style="font-size:1.9rem">年末の会社状態</h2>${yearStateCards()}</div><div class="tabs">${[['pl','P/L'],['bs','B/S'],['cf','C/F']].map(([x,l])=>`<button data-act="tab" data-tab="${x}" class="${s.tab===x?'active':''}">${l}</button>`).join('')}</div><div class="fin-panel"><div class="eyebrow">${sel.title}</div><table class="fin-table">${sel.rows.map(([k,v,em])=>`<tr class="${em?'emph':''}"><td>${esc(k)}</td><td>${sign(v)}</td></tr>`).join('')}</table><div class="hint">💡 ${sel.note}</div></div><div class="actions"><button class="btn" data-act="nextYear">${s.year===3?'最終結果を見る ▶':'翌年度の経営へ ▶'}</button></div>`}
function finale(){const total=s.history.reduce((n,x)=>n+x.profit,0);const projected=s.cash+s.ar-s.ap-s.shortDebt;const score=currentScore(),[rank,label]=gradeInfo(score);return `<div class="eyebrow">YEAR COMPLETE</div><div class="annual-subtitle"><h1 class="title">3年間の最終結果</h1><span class="year-tag">経営完了</span></div><div class="summary-card"><div class="summary-top"><div class="score-box"><small>総合経営点数</small><b>${score}/100点</b><div class="score-bar"><span style="width:${score}%"></span></div></div><div class="rank-card"><small>最終ランク</small><div class="rank-badge">${rank}</div><div>${label}</div></div></div><div class="review-grid"><div><small>3年間の累計利益</small><b>${fmt(total)}</b></div><div><small>4年目期首の見込現金</small><b>${fmt(projected)}</b></div><div><small>3年目末の短期借入</small><b>${fmt(s.shortDebt)}</b></div><div><small>将来性</small><b>${s.growth}/10</b></div></div><div class="message">${projected<0?'⚠️ 4年目の借入返済・精算に必要な現金が不足しています。':projected<3?'⚠️ 4年目の現金余力は小さく、次の投資に制約があります。':'✅ 4年目に向けて資金を残せました。'}<br>利益だけでなく、現金と将来への投資も含めて評価しましょう。</div>${yearStateCards()}</div><div class="actions"><button class="btn" data-act="restart">もう一度経営する ↻</button></div>`}
function failure(){return `<div class="eyebrow">⚠️ 経営終了</div><h1 class="title">現金が足りなくなりました</h1><div class="banner">${esc(s.reason||'支払い・返済に必要な現金が不足しました。')}</div><p class="lead">利益が出ていても、現金がなければ事業を続けたり、次の投資を選んだりできません。</p><div class="actions"><button class="btn" data-act="restart">最初からやり直す ↻</button></div>`}
function draw(){
 let html='';
 if(showTitle){root.innerHTML=startTitle();}
 else{
 try{if(totals(s).assets!==totals(s).liability)throw Error('貸借不一致');html={intro:introduction,decision,result,annual:financial,final:finale,bankrupt:failure}[s.phase]()}catch(e){html=`<div class="banner">動作エラー：${esc(e.message)}</div><button class="btn" data-act="restart">初期化する</button>`;console.error(e)}
 root.innerHTML=`<div class="retro-cabinet game-mode"><div class="retro-screen">${header()}${sky()}<main class="content phase-${s.phase}">${html}</main>${s.phase==='decision'||s.phase==='result'?kpis():''}<div class="footer">金額は億円の整数｜年度末にP/L・B/S・C/Fを確認｜v1.7</div></div><div class="retro-floor" aria-hidden="true"></div></div>`;
 }
 root.querySelectorAll('[data-act]').forEach(b=>b.addEventListener('click',()=>{
 const v=b.dataset.act;
 try{
  if(v==='new'){
    if(s.phase!=='intro'&&!confirm('保存中の経営データを破棄して新しく始めますか？'))return;
    s=fresh();s.phase='decision';showTitle=false;
  }else if(v==='resume'){
    if(s.phase==='intro')return;
    showTitle=false;
  }else if(v==='goTitle'){
    showTitle=true;
  }else if(v==='help'){
    alert('【未来つくり鉄道】\n3年間・全12四半期の経営ゲームです。\n毎四半期、3つから経営判断を1つ選択します。\n・年初の投資配分はありません\n・投資によって現金は減り、効果は翌年度からの場合があります\n・銀行借入は翌年度初めに全額返済\n・売上は翌四半期に入金\n・現金不足の投資は実行できません\n・年度末にはP/L・B/S・C/Fの3表を確認します。');
    return;
  }else if(v==='start'){s.phase='decision'}
  else if(v==='select'){s.selected=Number(b.dataset.n)}
  else if(v==='execute'){if(s.selected!=null&&!preview(s.selected).failed)commit(s.selected)}
  else if(v==='auto'){commit(-1)}
  else if(v==='advance'){endQuarter()}
  else if(v==='nextYear'){nextYear()}
  else if(v==='tab'){s.tab=b.dataset.tab}
  else if(v==='restart'){
     if(s.phase!=='intro'&&!confirm('経営データを消去して最初からやり直しますか？'))return;
     s=fresh();showTitle=true;
  }
  save();draw();
 }catch(e){console.error(e);alert('処理を完了できませんでした: '+e.message);}
 }));
}
window.__MIRAI_TEST__={getState:()=>clone(s),getEvents:()=>clone(E),choose:(i)=>{s.selected=i;return preview(i)},commit:(i)=>commit(i),advance:()=>{endQuarter();return s.phase},nextYear:()=>{nextYear();return s.phase},reset:()=>{s=fresh();save();draw();},check:()=>totals(s),preview:(i)=>preview(i)};draw();
})();
</script></body></html>
