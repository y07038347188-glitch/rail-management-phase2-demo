/* === JRPG retro town skin: visual-only; accounting engine unchanged === */
:root{--ink:#263b36;--muted:#536861;--line:#a9cbbb;--bg:#e7f1db;--green:#177c54;--green-dark:#126747}
body{background:repeating-linear-gradient(90deg,#eaf3df 0 14px,#e6f0db 14px 28px)}
.scene{position:relative;height:350px;border:4px solid #3e6957;border-radius:10px;overflow:hidden;box-shadow:0 5px 0 #acc5a5;background:#92bd76}
.scene canvas{display:block;width:100%;height:100%;object-fit:cover;image-rendering:pixelated;image-rendering:crisp-edges;cursor:crosshair;touch-action:manipulation}

.btn:hover{background:#166748}.ghost{border-radius:5px;border:2px solid #739980}

 <div class="budget-list">${CATS.map(investCard).join('')}</div>
 <div class="budget-totals"><span>投資予定 ${t}億</span><strong>残り ${Math.max(0,limit-t)}億</strong></div>
 <div class="cash-advice ${caution?'cash-advice-warn':''}" aria-label="現金を残す目安"><span>💡 目安：<b>${ideal}億円以上</b>残す（次の四半期の人件費2億＋運営費4億）</span><strong>投資全額支払後 ${availableAfter}億</strong></div>
 ${spendable===0?'<p class="budget-lock">🔒 現金だけでは投資できません。借入を検討できます。</p>':''}
 <div class="actions"><button class="btn" data-action="commit">この投資で1年を始める ▶</button></div></div>`
}
function eventScreen(){
 if(s.year===3&&s.q===1)return `<div class="event-compact"><div class="eyebrow">3年目・Q1｜🚨 緊急イベント</div><h1 class="h1">情報セキュリティ事故</h1><p class="event-context">社員の誤操作で情報が漏えい。教育投資が損失を減らします。</p><div class="accident-metrics"><span>基本損失 <b>5億円</b></span><span>教育効果 <b>−${Math.min(3,s.active.training)}億円</b></span><span>実際の損失 <b>${5-Math.min(3,s.active.training)}億円</b></span></div><div class="actions"><button class="btn" data-action="incident">事故の影響を確認 ▶</button></div></div>`;
 const key=`${s.year}-${s.q}`,e=EVENTS[key],meta=EVENT_META[key]||['経営判断','駅長'];
 return `<div class="event-compact"><div class="eyebrow">${s.year}年目・Q${s.q} ｜ ${esc(meta[0])}</div><h1 class="h1">${esc(e.title)}</h1><p class="event-context">${esc(e.description)}</p><div class="choice-list">${e.options.map((o,i)=>`<button class="choice" data-action="choice" data-idx="${i}"><span class="choice-key">${'ABC'[i]}</span><span class="choice-copy"><strong>${esc(o.label)}</strong><small>費用 ${o.cost}億円｜${esc(o.main)}</small></span><span class="arr">›</span></button>`).join('')}</div></div>`
}
function resultScreen(){const d=s.last,pdelta=d.afterProfit-d.preProfit,cdelta=d.afterCash-d.preCash;const story=d.accident?`事前教育で事故損失を${5-d.accident}億円軽減。`:`「${esc(d.chosen.label)}」を実施。`;return `<div class="eyebrow">${d.year}年目 第${d.quarter}四半期｜結果</div><h1 class="h1">経営判断の結果</h1><p class="lead">${story}現金と利益は別々に変化します。</p><div class="delta"><div class="box"><div class="boxtitle">現金残高</div><div class="big" id="cashAnimated" data-from="${d.preCash}" data-to="${d.afterCash}">${fmt(d.afterCash)}</div><div class="desc">今期 ${signed(cdelta)}</div></div><div class="box"><div class="boxtitle">今年の純利益</div><div class="big ${d.afterProfit<0?'negative':'positive'}">${fmt(d.afterProfit)}</div><div class="desc">今期 ${signed(pdelta)}</div></div></div><div class="finance-sentence">売上は翌期入金。借入元本の返済は利益を減らさず、現金を減らします。</div><div class="actions"><button class="btn" data-action="nextQuarter">${d.quarter===4?'年度末決算へ':'次の四半期へ'} ▶</button></div>`}
function row(name,val,emph=false){return `<tr class="${emph?'emph':''}"><td>${esc(name)}</td><td>${val}</td></tr>`}
let financeTab='pl';
function annualScreen(){const d=s.snapshot,p=d.pl,cf=d.cf;const assets=bs().assets,liab=bs().liab;
 const plrows=[row('売上',fmt(p.revenue)),row('人件費',fmt(-p.personnel)),row('営業費用・追加費',fmt(-p.operations-p.discretionary-p.incident)),row('諸税・減価償却',fmt(-p.levies-p.depreciation)),row('営業利益',fmt(d.operatingProfit),true),row('利息・法人税',fmt(-p.interest-p.tax)),row('当期純利益',fmt(d.profit),true)];
 const bsrows=[row('現金',fmt(s.cash)),row('売掛金・その他資産',fmt(s.ar+s.otherAssets)),row('固定資産',fmt(s.fixed)),row('資産合計',fmt(assets),true),row('負債',fmt(s.longDebt+s.shortDebt+s.otherLiab+s.ap)),row('純資産',fmt(s.equity)),row('負債＋純資産',fmt(liab),true)];
 const cfrows=[row('営業CF',fmt(cf.operating)),row('投資CF',fmt(cf.investing)),row('財務CF',fmt(cf.financing)),row('現金の増減',fmt(cf.operating+cf.investing+cf.financing),true),row('期首現金',fmt(d.openingCash)),row('期末現金',fmt(s.cash),true)];
 const datas={pl:{title:'P/L：今年はいくら儲かった？',rows:plrows},bs:{title:'B/S：現金・資産・負債は？',rows:bsrows},cf:{title:'C/F：現金はどう動いた？',rows:cfrows}};
 const active=datas[financeTab]||datas.pl;
 return `<div class="eyebrow">${s.year}年目｜年度末決算</div><div class="finance-top"><h1 class="h1">3つの財務諸表</h1><span>利益 ${signed(d.profit)} ／ 現金 ${fmt(s.cash)}</span></div><div class="finance-tabs" role="group" aria-label="見る財務諸表">${[['pl','P/L'],['bs','B/S'],['cf','C/F']].map(([v,label])=>`<button data-action="tab" data-tab="${v}" class="${financeTab===v?'selected':''}" aria-pressed="${financeTab===v}">${label}</button>`).join('')}</div><div class="sheet finance-one"><h3>${active.title}</h3><table>${active.rows.join('')}</table></div><div class="finance-sentence">${financeTab==='pl'?'利益は現金と同じではありません。':financeTab==='bs'?'設備投資は現金を減らし、固定資産を増やします。':'営業・投資・財務の現金の流れを確認しましょう。'} ${assets===liab?'':'※貸借不一致（要検証）'}</div><div class="actions"><button class="btn" data-action="nextYear">${s.year===3?'最終結果へ':'翌年度の投資へ'} ▶</button></div>`
}
function finalScreen(){const score=futureScore(),total=s.history.reduce((a,h)=>a+h.profit,0),review=total>4&&score.score>=6?'財務と将来への投資を両立できました。':total<0?'利益を生む仕組みの見直しが必要です。':score.cash<score.need?'経営を続けましたが、現金と返済に注意が必要です。':'利益・現金・安全の関係を振り返りましょう。';return `<div class="eyebrow">経営シミュレーション完了</div><h1 class="h1">3年間の経営結果</h1><div class="final-grid"><div class="box"><div class="desc">累計純利益</div><strong>${fmt(total)}</strong></div><div class="box"><div class="desc">翌年期首の現金</div><strong>${fmt(score.cash)}</strong></div><div class="box"><div class="desc">短期借入残高</div><strong>${fmt(s.shortDebt)}</strong></div><div class="box"><div class="desc">将来性</div><strong>${score.score} / 10点</strong></div></div><p class="finance-sentence">${review} 現金を確保するのは、次の投資を選べるようにするためです。</p><div class="actions"><button class="btn" data-action="restart">もう一度経営する ▶</button></div>`}
function bankruptScreen(){return `<div class="eyebrow">経営シミュレーション終了</div><h1 class="h1 negative">現金不足で経営終了</h1><p class="lead">${esc(s.reason)}</p><div class="delta"><div class="box"><div class="boxtitle">現金</div><div class="big negative">${fmt(s.cash)}</div></div><div class="box"><div class="boxtitle">純利益</div><div class="big">${fmt(netProfit())}</div></div></div><p class="finance-sentence">利益が黒字でも、支払いに使える現金がなければ投資や事業継続はできません。</p><div class="actions"><button class="btn" data-action="restart">再挑戦する ▶</button></div>`}
function render(){let content='';try{invariants();}catch(e){console.error(e);content=`<p>会計データの整合性エラーです。試作版のデータを初期化してください。</p><button class="btn" data-action="restart">やり直す</button>`}
 if(!content)content=({intro,budget,event:eventScreen,result:resultScreen,annual:annualScreen,final:finalScreen,bankrupt:bankruptScreen})[s.phase]?.()||intro();
 root.innerHTML=`<header class="header"><div class="brand"><div class="brand-logo">🚆</div><div><strong>未来つくり鉄道</strong><small>ドット絵RPG｜改善版 v0.7</small></div></div><div class="header-right"><span class="chip">3年間・12四半期</span><button class="ghost" data-action="help">ルール</button><button class="ghost" data-action="restart">最初から</button></div></header>${trainScene()}${kpis()}${track()}<section id="gameContent" class="mainpanel vis-transition" tabindex="-1">${content}</section><div class="footer">金額はすべて億円の整数／試作版の財務数値・イベントは教育用モデルです／自動保存 ／ 借入の翌年度返済を修正 ／ 1画面 v0.7</div>`;
 bind();startRpgWorld();if(s.phase==='result')animateCash()}
function animateCash(){const el=document.getElementById('cashAnimated');if(!el||window.matchMedia?.('(prefers-reduced-motion: reduce)').matches)return;const from=Number(el.dataset.from),to=Number(el.dataset.to);const start=performance.now();const duration=500;function frame(t){if(!el.isConnected)return;const d=Math.min(1,(t-start)/duration);el.textContent=fmt(Math.round(from+(to-from)*(1-Math.pow(1-d,3))));if(d<1)requestAnimationFrame(frame)}requestAnimationFrame(frame)}
function help(){alert('【未来つくり鉄道】\n・3年間（12四半期）を経営します。\n・各年初に5項目へ1億円ずつ投資配分します。\n・現金から最低2億円を確保して投資枠を計算します。余裕を持つなら、次の四半期の基本支出5億円程度を残すのが一つの目安です。\n・銀行借入を選べますが、翌年度初めに元本を全額返済します。\n・四半期イベントの3択で経営を判断します。\n・3年目Q1は情報漏えい事故の自動結果確認です。\n・各年度末にP/L・B/S・C/Fの3表を見ます。\n・金額はすべて整数の億円、結果は自動保存されます。')}
function bind(){root.querySelectorAll('[data-action]').forEach(el=>{el.addEventListener('click',()=>{const action=el.dataset.action;try{if(action==='start'){beginYear();focusTop();return}if(action==='restart'){resetGame();return}if(action==='help'){help();return}if(action==='tab'){financeTab=el.dataset.tab;render();return}if(action==='borrow'){setBorrow(Number(el.dataset.value));return}if(action==='invest'){budgetChange(el.dataset.cat,Number(el.dataset.delta));return}if(action==='commit'){commitBudget();focusTop();return}if(action==='choice'){runQuarter(Number(el.dataset.idx));focusTop();return}if(action==='incident'){runQuarter(-1);focusTop();return}if(action==='nextQuarter'){nextFromResult();focusTop();return}if(action==='nextYear'){nextFromAnnual();focusTop();return}}catch(e){console.error(e);alert('計算エラーが発生しました。コンソールとゲームの状態を確認してください。')}})})}
// Public test-only hooks: invoked by developer tools without affecting the participant UI.
window.__MIRAI_TEST__={getState:()=>clone(s),reset:()=>{s=initial();store();render()},start:()=>beginYear(),borrow:setBorrow,allocate:budgetChange,commit:commitBudget,turn:runQuarter,next:nextFromResult,advance:nextFromAnnual,assert:invariants,allEvents:EVENTS};
render();
})();
</script>
