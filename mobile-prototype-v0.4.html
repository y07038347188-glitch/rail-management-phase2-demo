    <p class="note">短期借入は翌年度初めに全額返済します。予想売上や利益はそのまま投資資金にはできません。</p>
   </details>
   ${locked?`<div class="cashlock">🔒 現金だけでは追加投資できません。銀行借入を使えば投資枠を増やせます。</div>`:''}
   ${prior?`<div class="budget-topline">前年利益 ${signed(prior.profit)} ／ 前年末現金 ${fmt(prior.cash)}</div>`:''}
  </div></div>
  <div class="budget-invest">
   <div class="box"><div class="boxtitle">投資先を選択（1億円ずつ）</div>${CATS.map(investCard).join('')}</div>
   <div class="totalbar" role="status" aria-live="polite"><span><b>今年の投資予定</b><br><small>費用は年度中に自動支払い</small></span><span class="big ${t>limit?'negative':''}">${t} / ${limit}億円</span></div>
   <p class="note">投資の効果は翌年度からです。投資を使い切る必要はなく、未配分の現金は残ります。</p>
   <div class="actions"><button class="btn" data-action="commit">この内容で1年を始める　→</button></div>
  </div>
 </div>`
}
function eventScreen(){if(s.year===3&&s.q===1)return `<div class="eyebrow">3年目 第1四半期｜自動イベント</div><h1 class="h1">⚠️ 情報セキュリティ事故が発生</h1><p class="lead">社員の誤操作による情報漏えいが発生しました。1・2年目のリスク対応教育投資の効果に応じ、損失が自動的に決まります。追加の判断は不要です。</p><div class="split"><div class="box"><div class="boxtitle">事故損失の自動計算</div><div class="lineval"><span>対策なしの損失</span><strong>5億円</strong></div><div class="lineval"><span>これまでの教育投資効果</span><strong class="positive">−${Math.min(3,s.active.training)}億円</strong></div><div class="totalbar"><b>実際の損失</b><span class="big">${5-Math.min(3,s.active.training)}億円</span></div></div><div class="box soft"><p class="boxtitle">過去の経営判断が、今の損失を変えます。</p><p class="lead" style="margin-bottom:8px">事故の損失は、利益と現金の両方に反映されます。この四半期は、結果を確認するだけで終了します。</p></div></div><div class="actions"><button class="btn" data-action="incident">事故の影響を確認　→</button></div>`;
 const e=EVENTS[`${s.year}-${s.q}`];return `<div class="eyebrow">${s.year}年目 第${s.q}四半期｜経営判断</div><h1 class="h1">${esc(e.title)}</h1><p class="lead">${esc(e.description)} あなたなら、どう判断しますか？</p><div class="choice-list">${e.options.map((o,i)=>`<button class="choice" data-action="choice" data-idx="${i}"><span class="choice-key">${'ABC'[i]}</span><span><strong>${esc(o.label)}</strong><small>費用：${o.cost}億円　｜　${esc(o.main)}</small></span><span class="arr">›</span></button>`).join('')}</div><div class="warning">💡 数字の変化は選択後に表示されます。給料・運営費・売上入金などの通常の会計処理は自動です。</div>`}
function resultScreen(){const d=s.last,pdelta=d.afterProfit-d.preProfit,cdelta=d.afterCash-d.preCash;const story=d.accident?`事前の教育投資が事故損失を${5-d.accident}億円軽減しました。`:`「${esc(d.chosen.label)}」を実施しました。`;return `<div class="eyebrow">${d.year}年目 第${d.quarter}四半期｜判断結果</div><h1 class="h1">経営判断の結果</h1><p class="lead">${story} この四半期は通常の運行費用・売上・投資支払も自動的に記録しています。</p><div class="delta"><div class="box"><div class="boxtitle">現金残高</div><div class="big" id="cashAnimated" data-from="${d.preCash}" data-to="${d.afterCash}">${fmt(d.afterCash)}</div><div class="desc">今期の変化　<span class="${cdelta<0?'negative':'positive'}">${signed(cdelta)}</span></div></div><div class="box"><div class="boxtitle">今年の累計純利益</div><div class="big ${d.afterProfit<0?'negative':'positive'}">${fmt(d.afterProfit)}</div><div class="desc">今期の利益変化　${signed(pdelta)}</div></div></div><div class="metric-chips"><span class="mchip">安全 ${d.safety}/10</span><span class="mchip">社員の状態 ${d.morale}/10</span><span class="mchip">満足度 ${d.satisfaction}/10</span><span class="mchip">売上代金は翌期入金</span></div><div class="box soft"><div class="boxtitle">利益と現金は、同じではありません</div><div class="lineval"><span>今期入金された売上代金</span><strong>${d.settlement.income}億円</strong></div><div class="lineval"><span>今期支払った買掛金等</span><strong>${d.settlement.expense}億円</strong></div><div class="lineval"><span>今期支払った借入元本</span><strong>${d.settlement.repayment}億円</strong></div><p class="note">売上は発生した四半期の利益に反映され、現金の入金は翌四半期です。元本返済は現金を減らしますが、利益を減らしません。</p></div><div class="actions"><button class="btn" data-action="nextQuarter">${d.quarter===4?'年度末の財務三表を見る　→':'次の四半期へ　→'}</button></div>`}
function row(name,val,emph=false){return `<tr class="${emph?'emph':''}"><td>${esc(name)}</td><td>${val}</td></tr>`}
function annualScreen(){const d=s.snapshot,p=d.pl,cf=d.cf;const assets=bs().assets,liab=bs().liab;
 const plrows=[row('売上',fmt(p.revenue)),row('人件費',fmt(-p.personnel)),row('その他営業費・追加費',fmt(-p.operations-p.discretionary-p.incident)),row('諸税・減価償却',fmt(-p.levies-p.depreciation)),row('営業利益',fmt(d.operatingProfit),true),row('利息・法人税',fmt(-p.interest-p.tax)),row('当期純利益',fmt(d.profit),true)];
 const bsrows=[row('現金',fmt(s.cash)),row('売掛金・その他資産',fmt(s.ar+s.otherAssets)),row('固定資産',fmt(s.fixed)),row('資産合計',fmt(assets),true),row('借入・その他負債',fmt(s.longDebt+s.shortDebt+s.otherLiab+s.ap)),row('純資産',fmt(s.equity)),row('負債＋純資産',fmt(liab),true)];
 const cfrows=[row('営業キャッシュフロー',fmt(cf.operating)),row('投資キャッシュフロー',fmt(cf.investing)),row('財務キャッシュフロー',fmt(cf.financing)),row('現金の増減',fmt(cf.operating+cf.investing+cf.financing),true),row('期首現金',fmt(d.openingCash)),row('期末現金',fmt(s.cash),true)];
 return `<div class="eyebrow">${s.year}年目｜年度末決算</div><h1 class="h1">会社の成績を3つの表で確認</h1><p class="lead">あなたの判断が、利益・会社の財産・現金にどう影響したかを振り返ります。</p><div class="ann-grid"><div class="sheet"><h3>① P/L 損益計算書</h3><p>今年いくら儲かった？</p><table>${plrows.join('')}</table></div><div class="sheet"><h3>② B/S 貸借対照表</h3><p>現金・設備・借入はどれくらい？</p><table>${bsrows.join('')}</table></div><div class="sheet"><h3>③ C/F キャッシュフロー</h3><p>現金はどこから来て、何に使った？</p><table>${cfrows.join('')}</table></div></div><div class="box soft" style="margin-top:13px"><div class="boxtitle">今年の学び</div><p class="finance-explain">営業利益 <b>${fmt(d.operatingProfit)}</b> に対して、現金の増減は <b>${signed(cf.operating+cf.investing+cf.financing)}</b>。設備への投資は現金を減らしますが、資産を増やします。今の現金と利益の両方を確認しましょう。</p><p class="note">B/Sは左右が${assets===liab?'一致しています':'一致していません（要検証）'}。実際の会計を学びやすく簡素化したモデルです。</p></div><div class="actions"><button class="btn" data-action="nextYear">${s.year===3?'3年間の最終結果を見る　→':`${s.year+1}年目の資金状況を確認　→`}</button></div>`}
function finalScreen(){const score=futureScore(),total=s.history.reduce((a,h)=>a+h.profit,0),bad=score.cash<score.need/2,review=total>4&&score.score>=6?'財務と将来への投資をバランスよく進めました。':total<0?'将来への投資だけでなく、利益を生み出す仕組みも見直す必要があります。':score.cash<score.need?'経営を続けましたが、次の投資に使える現金には注意が必要です。':'3年間の経営を継続しました。利益だけでなく、投資・現金・安全のつながりを振り返りましょう。';return `<div class="eyebrow">経営シミュレーション完了</div><h1 class="h1">🚆 3年間の経営結果</h1><p class="lead">あなたの経営判断は、どんな会社をつくりましたか？</p><div class="final-grid"><div class="box"><div class="desc">3年間の累計純利益</div><strong>${fmt(total)}</strong></div><div class="box"><div class="desc">翌年の期首見込現金</div><strong class="${score.cash<score.need?'negative':'positive'}">${fmt(score.cash)}</strong></div><div class="box"><div class="desc">期末の新規借入</div><strong>${fmt(s.shortDebt)}</strong></div><div class="box"><div class="desc">将来性</div><strong class="positive">${score.score} / 10点</strong></div></div><div class="box soft" style="margin-top:14px"><div class="boxtitle">経営への総評</div><p class="lead" style="margin-bottom:0">${review}</p><div class="metric-chips"><span class="mchip">安全 ${s.safety}/10</span><span class="mchip">社員の状態 ${s.morale}/10</span><span class="mchip">満足度 ${s.satisfaction}/10</span></div></div><div class="split" style="margin-top:13px"><div class="box"><div class="boxtitle">純利益の推移</div>${s.history.map(x=>`<div class="history-row"><span style="width:36px">${x.year}年目</span><div class="bar-track"><div class="bar-inner" style="width:${Math.max(4,Math.min(100,Math.abs(x.profit)/14*100))}%;background:${x.profit<0?'#cc7263':'#3ba884'}"></div></div><strong style="width:58px;text-align:right">${signed(x.profit)}</strong></div>`).join('')}</div><div class="box"><div class="boxtitle">次年度の投資余力</div><div class="lineval"><span>次年度の現金（債権・債務・返済を精算後）</span><strong>${score.cash}億円</strong></div><div class="lineval"><span>安全のため残したい運転資金</span><strong>${score.need}億円</strong></div><div class="lineval"><span>借入なしの投資余力（目安）</span><strong class="${bad?'negative':'positive'}">${Math.max(0,score.cash-score.need)}億円</strong></div><p class="note">将来性は投資効果から最大10点。必要運転資金に不足すると最大2点減点。現金を貯めるだけでは加点されません。</p></div></div><div class="actions"><button class="btn secondary" data-action="restart">もう一度経営する</button></div>`}
function bankruptScreen(){return `<div class="eyebrow">経営シミュレーション終了</div><h1 class="h1 negative">現金が不足し、経営を続けられませんでした</h1><p class="lead">${esc(s.reason)} 利益が黒字でも、返済や支払いに必要な現金がなければ事業を続けられません。</p><div class="split"><div class="box"><div class="boxtitle">現在の財務状況</div><div class="lineval"><span>現金残高</span><strong class="negative">${fmt(s.cash)}</strong></div><div class="lineval"><span>今年の純利益</span><strong>${fmt(netProfit())}</strong></div><div class="lineval"><span>新規借入残高</span><strong>${fmt(s.shortDebt)}</strong></div></div><div class="box soft"><div class="boxtitle">今回の学び</div><p class="lead" style="margin-bottom:0">手元資金は、将来への投資を行うための大切な経営資源です。次は現金と借入返済のタイミングにも注意してみましょう。</p></div></div><div class="actions"><button class="btn" data-action="restart">最初から再挑戦　→</button></div>`}
function render(){let content='';try{invariants();}catch(e){console.error(e);content=`<p>会計データの整合性エラーです。試作版のデータを初期化してください。</p><button class="btn" data-action="restart">やり直す</button>`}
 if(!content)content=({intro,budget,event:eventScreen,result:resultScreen,annual:annualScreen,final:finalScreen,bankrupt:bankruptScreen})[s.phase]?.()||intro();
 root.innerHTML=`<header class="header"><div class="brand"><div class="brand-logo">🚆</div><div><strong>未来つくり鉄道</strong><small>JR東日本の財務構造を参考にした経営ゲーム｜スマホ修正版 v0.4</small></div></div><div class="header-right"><span class="chip">3年間・12四半期</span><button class="ghost" data-action="help">ルール</button><button class="ghost" data-action="restart">最初から</button></div></header>${trainScene()}${kpis()}${track()}<section id="gameContent" class="mainpanel vis-transition" tabindex="-1">${content}</section><div class="footer">金額はすべて億円の整数／試作版の財務数値・イベントは教育用モデルです／自動保存 ／ スマホ修正版 v0.4</div>`;
 bind();if(s.phase==='result')animateCash()}
function animateCash(){const el=document.getElementById('cashAnimated');if(!el||window.matchMedia?.('(prefers-reduced-motion: reduce)').matches)return;const from=Number(el.dataset.from),to=Number(el.dataset.to);const start=performance.now();const duration=500;function frame(t){if(!el.isConnected)return;const d=Math.min(1,(t-start)/duration);el.textContent=fmt(Math.round(from+(to-from)*(1-Math.pow(1-d,3))));if(d<1)requestAnimationFrame(frame)}requestAnimationFrame(frame)}
function help(){alert('【未来つくり鉄道】\n・3年間（12四半期）を経営します。\n・各年初に5項目へ1億円ずつ投資配分します。\n・現金から運転資金2億円を差し引いた範囲で投資できます。\n・銀行借入を選べますが、翌年度初めに元本を全額返済します。\n・四半期イベントの3択で経営を判断します。\n・3年目Q1は情報漏えい事故の自動結果確認です。\n・各年度末にP/L・B/S・C/Fの3表を見ます。\n・金額はすべて整数の億円、結果は自動保存されます。')}
function bind(){root.querySelectorAll('[data-action]').forEach(el=>{el.addEventListener('click',()=>{const action=el.dataset.action;try{if(action==='start'){beginYear();focusTop();return}if(action==='restart'){resetGame();return}if(action==='help'){help();return}if(action==='borrow'){setBorrow(Number(el.dataset.value));return}if(action==='invest'){budgetChange(el.dataset.cat,Number(el.dataset.delta));return}if(action==='commit'){commitBudget();focusTop();return}if(action==='choice'){runQuarter(Number(el.dataset.idx));focusTop();return}if(action==='incident'){runQuarter(-1);focusTop();return}if(action==='nextQuarter'){nextFromResult();focusTop();return}if(action==='nextYear'){nextFromAnnual();focusTop();return}}catch(e){console.error(e);alert('計算エラーが発生しました。コンソールとゲームの状態を確認してください。')}})})}
// Public test-only hooks: invoked by developer tools without affecting the participant UI.
window.__MIRAI_TEST__={getState:()=>clone(s),reset:()=>{s=initial();store();render()},start:()=>beginYear(),borrow:setBorrow,allocate:budgetChange,commit:commitBudget,turn:runQuarter,next:nextFromResult,advance:nextFromAnnual,assert:invariants,allEvents:EVENTS};
render();
})();
</script>
