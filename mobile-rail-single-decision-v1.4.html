function result(){const d=s.last;if(!d?.flows)return `<p>決算データを確認できません。</p>`;return `<div class="eyebrow">📣 ${d.year}年目・Q${d.q} ｜ 今期の結果</div><h1 class="title">${esc(d.option)}</h1>${d.shockLabel?`<div class="banner">⚠️ ${esc(d.shockLabel)}</div>`:''}<div class="cashbook"><div class="line"><span>今期開始時の現金</span><strong>${fmt(d.before)}</strong></div>${d.flows.filter(x=>!x.accounting).map(f=>`<div class="line"><span>${esc(f.label)}</span><strong class="${f.n>0?'plus':f.n<0?'minus':''}">${sign(f.n)}</strong></div>`).join('')}<div class="line total"><span>今期終了時の現金</span><strong>${fmt(d.after)}</strong></div></div><div class="impact"><strong>経営判断と財務のつながり</strong><div>現金の変化 ${sign(d.cashDelta)} ／ 今期の利益への影響 ${sign(d.profitDelta)}</div><div class="short">売上は発生時に利益へ反映し、売上代金は原則翌四半期に入金します。設備投資は現金を減らし、固定資産を増やします。</div></div><div class="actions"><button class="btn" data-act="advance">${s.q===4?'年度末の財務三表を確認 ▶':'次の経営判断へ ▶'}</button></div>`}
function financial(){const p=s.pl,cf=s.cf,bs=totals(s);const plrows=[['売上高',p.revenue],['人件費',-p.payroll],['運営費',-p.operations],['その他経費・災害対応',-p.event-p.levies],['減価償却費',-p.depreciation],['営業利益',operatingProfit(s),1],['利息・法人税',-p.interest-p.tax],['当期利益',yearProfit(s),1]];const bsrows=[['現金',s.cash],['売掛金',s.ar],['その他資産',s.otherAssets],['固定資産',s.fixed],['資産合計',bs.assets,1],['負債（長期・短期ほか）',s.longDebt+s.shortDebt+s.otherLiab+s.ap],['純資産',s.equity],['負債＋純資産',bs.liability,1]];const cfrows=[['営業活動による現金',cf.operating],['設備投資による現金',cf.investing],['借入・返済による現金',cf.financing],['現金の増減',cf.operating+cf.investing+cf.financing,1],['期首現金',s.yearOpenCash],['期末現金',s.cash,1]];const data={pl:{title:'P/L｜今年いくら儲かった？',rows:plrows,note:'利益には、まだ入金されていない売上も含まれます。'},bs:{title:'B/S｜会社の財産と借金',rows:bsrows,note:'設備投資は固定資産になり、現金の支払いとは別に記録されます。'},cf:{title:'C/F｜現金はどう動いた？',rows:cfrows,note:'黒字でも、設備投資や借入返済で現金が減ることがあります。'}};const sel=data[s.tab]||data.pl;return `<div class="eyebrow">📊 ${s.year}年目・決算</div><h1 class="title">利益と現金は同じではない</h1><div class="review-grid"><div><small>今年の当期利益</small><b>${fmt(yearProfit(s))}</b></div><div><small>年度末の現金</small><b>${fmt(s.cash)}</b></div></div><div class="tabs">${[['pl','P/L'],['bs','B/S'],['cf','C/F']].map(([x,l])=>`<button data-act="tab" data-tab="${x}" class="${s.tab===x?'active':''}">${l}</button>`).join('')}</div><div class="eyebrow">${sel.title}</div><table class="fin-table">${sel.rows.map(([k,v,em])=>`<tr class="${em?'emph':''}"><td>${esc(k)}</td><td>${sign(v)}</td></tr>`).join('')}</table><div class="hint">💡 ${sel.note}</div><div class="actions"><button class="btn" data-act="nextYear">${s.year===3?'最終結果を見る ▶':'翌年度の経営へ ▶'}</button></div>`}
function finale(){const total=s.history.reduce((n,x)=>n+x.profit,0);const projected=s.cash+s.ar-s.ap-s.shortDebt;const score=Math.max(0,Math.min(10,Math.round(s.growth+s.safety/5+s.customer/5)- (projected<3?2:projected<6?1:0)));return `<div class="eyebrow">🏁 3年間の経営を完了</div><h1 class="title">未来町はどう成長した？</h1><div class="review-grid"><div><small>3年間の累計利益</small><b>${fmt(total)}</b></div><div><small>4年目期首の見込現金</small><b>${fmt(projected)}</b></div><div><small>3年目末の短期借入</small><b>${fmt(s.shortDebt)}</b></div><div><small>将来性の目安</small><b>${score} / 10点</b></div></div><div class="message">${projected<0?'⚠️ 4年目の借入返済・精算に必要な現金が不足しています。':projected<3?'⚠️ 4年目の現金余力は小さく、次の投資に制約があります。':'✅ 4年目に向けて資金を残せました。'}<br>利益だけでなく、現金と将来への投資も評価しましょう。</div><div class="hint">将来性は試作版の参考点です。経営判断に唯一の正解はありません。</div><div class="actions"><button class="btn" data-act="restart">もう一度経営する ↻</button></div>`}
function failure(){return `<div class="eyebrow">⚠️ 経営終了</div><h1 class="title">現金が足りなくなりました</h1><div class="banner">${esc(s.reason||'支払い・返済に必要な現金が不足しました。')}</div><p class="lead">利益が出ていても、現金がなければ事業を続けたり、次の投資を選んだりできません。</p><div class="actions"><button class="btn" data-act="restart">最初からやり直す ↻</button></div>`}
function draw(){root.className=(s.phase==='decision'&&s.selected!=null)?'selection-preview':'';let html='';try{if(totals(s).assets!==totals(s).liability)throw Error('貸借不一致');html={intro:introduction,decision,result,annual:financial,final:finale,bankrupt:failure}[s.phase]()}catch(e){html=`<div class="banner">動作エラー：${esc(e.message)}</div><button class="btn" data-act="restart">初期化する</button>`;console.error(e)}root.innerHTML=`${header()}${sky()}<main class="content">${html}</main>${s.phase==='decision'||s.phase==='result'?kpis():''}<div class="footer">学習用の簡易会計｜金額はすべて億円の整数｜v1.4</div>`;root.querySelectorAll('[data-act]').forEach(b=>b.addEventListener('click',()=>{const v=b.dataset.act;try{if(v==='help'){alert('【未来つくり鉄道】\n毎四半期、3案から1つ選ぶ経営ゲーム。年初の投資配分はありません。\n・通常費は自動支払い\n・投資は現金を減らし、効果は原則翌年度から\n・借入は翌年度の初めに全額返済\n・売上は翌期に入金\n・現金不足の投資は選べません\n・年1回の大きな危機と年度末の財務三表を確認します。');return}if(v==='start'){s.phase='decision'}else if(v==='select'){s.selected=Number(b.dataset.n)}else if(v==='execute'){if(s.selected!=null&&!preview(s.selected).failed)commit(s.selected)}else if(v==='auto'){commit(-1)}else if(v==='settleFailure'){commit(0)}else if(v==='advance'){endQuarter()}else if(v==='nextYear'){nextYear()}else if(v==='tab'){s.tab=b.dataset.tab}else if(v==='restart'){if(!confirm('経営を最初からやり直しますか？'))return;s=fresh()}save();draw()}catch(e){console.error(e);alert('処理を完了できませんでした: '+e.message);}}))}
window.__MIRAI_TEST__={getState:()=>clone(s),getEvents:()=>clone(E),choose:(i)=>{s.selected=i;return preview(i)},commit:(i)=>commit(i),advance:()=>{endQuarter();return s.phase},nextYear:()=>{nextYear();return s.phase},reset:()=>{s=fresh();save();draw();},check:()=>totals(s),preview:(i)=>preview(i)};draw();
})();
</script></body></html>
